  // ---------------------------------------------------------------
  // Filtres de la liste (spec liste-equipes) : recopiés du Classement, sans
  // découpage ni club. Le pli du bloc est commun aux quatre pages (script à
  // part, plus bas).
  // ---------------------------------------------------------------
  var SPEC_LABELS = { "2": "Trinquet / P.G Pleine Masculin" };
  var FILTER_CACHE_KEY = "lidfpb_equipes_filters_v1";
  var filterState = { specs: {}, series: { "1": true, "2": true } };

  function loadFilterState() {
    try {
      var saved = JSON.parse(localStorage.getItem(FILTER_CACHE_KEY));
      // Seuls des booléens sont repris : un état abîmé laisse les valeurs par défaut.
      ["specs", "series"].forEach(function (champ) {
        var v = saved && saved[champ];
        if (!v || typeof v !== "object" || Array.isArray(v)) return;
        Object.keys(v).forEach(function (k) {
          if (typeof v[k] === "boolean" && k !== "__proto__") filterState[champ][k] = v[k];
        });
      });
    } catch (e) { /* stockage indisponible ou corrompu : valeurs par défaut */ }
  }

  function saveFilterState() {
    try { localStorage.setItem(FILTER_CACHE_KEY, JSON.stringify(filterState)); } catch (e) { /* pas bloquant */ }
  }

  // Une spécialité ou une série inconnue de l'état est affichée.
  function equipeAffichee(t) {
    return filterState.specs[t.spec] !== false && filterState.series[t.cat] !== false;
  }

  // Plus d'une spécialité dans les données : les cartes et l'aperçu la nomment.
  function specsMultiples() {
    var vues = {};
    Object.keys(etat.index).forEach(function (k) { vues[etat.index[k].spec] = true; });
    return Object.keys(vues).length > 1;
  }

  function libelleSpec(spec) { return SPEC_LABELS[spec] || ("Spécialité " + (spec || "?")); }

  // Les pastilles de spécialité, d'après toutes les équipes, jamais les
  // équipes déjà filtrées. Une valeur inconnue de l'état démarre active.
  function renderSpecChips() {
    var container = document.getElementById("filterSpecs");
    var vues = {};
    Object.keys(etat.index).forEach(function (k) { vues[etat.index[k].spec] = true; });
    container.innerHTML = "";
    Object.keys(vues).sort(function (a, b) { return a.localeCompare(b, "fr", { numeric: true }); })
      .forEach(function (spec) {
        if (!Object.prototype.hasOwnProperty.call(filterState.specs, spec)) filterState.specs[spec] = true;
        var chip = el("button", {
          type: "button",
          class: "filter-chip" + (filterState.specs[spec] ? " active" : ""),
          text: libelleSpec(spec)
        });
        chip.addEventListener("click", function () {
          filterState.specs[spec] = !filterState.specs[spec];
          chip.classList.toggle("active", filterState.specs[spec]);
          saveFilterState();
          if (etat.index && !etat.cle) renderListe();
        });
        container.appendChild(chip);
      });
    saveFilterState();
  }

  function setupFilters() {
    loadFilterState();
    document.querySelectorAll("#filterSeries .filter-chip").forEach(function (chip) {
      var serie = chip.getAttribute("data-serie");
      chip.classList.toggle("active", filterState.series[serie] !== false);
      chip.addEventListener("click", function () {
        filterState.series[serie] = filterState.series[serie] === false;
        chip.classList.toggle("active", filterState.series[serie]);
        saveFilterState();
        if (etat.index && !etat.cle) renderListe();
      });
    });
  }

  // Lignes dépliées, par équipe : elles le restent quand la liste est
  // redessinée (rafraîchissement, retour depuis une équipe), le temps de la
  // visite. Rien n'est gardé.
  var deplies = {};
  // De même pour le message des phases finales.
  var messageOuvert = false;

  // Les équipes par série et par poule, dans l'ordre du classement de chaque
  // poule. Une équipe sans partie de poule va dans « Hors poule » de sa série.
  function groupesDeLaListe() {
    var groupes = {};
    function groupe(spec, cat, poule) {
      var k = [spec, cat, poule].join("|");
      return groupes[k] || (groupes[k] = { spec: spec, cat: cat, poule: poule, equipes: [] });
    }
    // Des copies, au nom court : les équipes pas encore classées se rangent
    // dans l'ordre de ce qui est affiché. Le classement lui-même n'en dépend pas.
    var placees = {};
    etat.standings.forEach(function (s) {
      var cle = teamKey(s.spec, s.cat, s.clubCode, s.numero);
      if (!etat.index[cle] || placees[cle]) return;
      var copie = Object.assign({}, s, { label: nomCourt(etat.clubMap, s.clubCode, s.numero) });
      groupe(s.spec, s.cat, s.poule).equipes.push(copie);
      placees[cle] = true;
    });
    Object.keys(etat.index).forEach(function (cle) {
      if (placees[cle]) return;
      var t = etat.index[cle];
      groupe(t.spec, t.cat, "").equipes.push({ spec: t.spec, cat: t.cat, clubCode: t.clubCode, numero: t.numero, jouees: 0, label: nomCourt(etat.clubMap, t.clubCode, t.numero) });
    });
    // Le classement est fait sur toute la poule, puis les filtres écartent des
    // cartes entières : aucun rang ne bouge.
    return Object.keys(groupes).map(function (k) {
      var g = groupes[k];
      g.equipes = trierClassement(g.equipes);
      return g;
    }).filter(equipeAffichee).sort(function (a, b) {
      return a.spec.localeCompare(b.spec, "fr", { numeric: true }) ||
             a.cat.localeCompare(b.cat, "fr", { numeric: true }) ||
             (a.poule === "" ? 1 : 0) - (b.poule === "" ? 1 : 0) ||
             a.poule.localeCompare(b.poule, "fr", { numeric: true });
    });
  }

  // WhatsApp (conversation vide) et SMS vers le responsable, puis, en mode
  // organisateur, l'avion en papier de la communication choisie : toujours
  // créé, montré ou caché par majEnvois. Ni le nom ni le numéro du responsable
  // ne s'affichent : les icônes nomment l'équipe.
  function buildActions(team, court) {
    var actions = el("div", { class: "rank-actions" });
    var numero = team.contact ? normalizePhoneForWhatsapp(team.contact.tel) : null;
    if (!numero) return actions;
    var qui = " au responsable de " + court;
    var liens = [
      ["wa", ICON_SVG_WHATSAPP, "https://wa.me/" + numero, "Écrire sur WhatsApp" + qui],
      ["sms", ICON_SVG_SMS, "sms:+" + numero, "Envoyer un SMS" + qui]
    ];
    if (ORGA) liens.push(["message contact-message", SVG_ENVOI, "https://api.whatsapp.com/send?phone=" + numero, ""]);
    liens.forEach(function (c) {
      var a = el("a", { class: "contact-btn " + c[0], href: c[2] });
      if (c[3]) { a.title = c[3]; a.setAttribute("aria-label", c[3]); }
      if (c[2].indexOf("https://") === 0) { a.target = "_blank"; a.rel = "noopener"; }
      a.innerHTML = c[1];
      if (c[0].indexOf("contact-message") !== -1) {
        a.hidden = true;
        envois.push({ a: a, team: team, court: court, numero: numero });
        // Une frappe dans « Perso » n'est reportée qu'après 150 ms : au
        // toucher, le lien est mis à jour avant que WhatsApp s'ouvre.
        a.addEventListener("click", function () {
          if (minuteurEnvois) { clearTimeout(minuteurEnvois); minuteurEnvois = null; majEnvois(); }
        });
      }
      actions.appendChild(a);
    });
    return actions;
  }

  // Le dépli : nom officiel, joueurs, et le lien vers la page de l'équipe.
  // Rempli à la première ouverture, pour qu'aucun nom de joueur ne soit dans
  // la page tant qu'on n'a rien touché.
  function remplirDepli(plus, team, cle) {
    if (plus.childNodes.length) return;
    plus.appendChild(el("div", { class: "rank-nom", text: clubLabel(etat.clubMap, team.clubCode, team.numero) }));
    if (!etat.data.compositionsIndisponibles) {
      var joueurs = el("div", { class: "rank-joueurs" + (team.roster ? "" : " inconnus") });
      joueurs.innerHTML = SVG_JOUEURS;
      joueurs.appendChild(el("span", { text: team.roster ? team.roster.join(", ") : "Composition non déclarée à la ligue" }));
      plus.appendChild(joueurs);
    }
    var voir = el("a", { class: "voir-equipe", href: adresse(cle), text: "Voir l'équipe →" });
    voir.addEventListener("click", function (ev) {
      ev.preventDefault();
      ouvrirEquipe(cle, true);
    });
    plus.appendChild(voir);
  }

  function buildLigneEquipe(s, rang, n) {
    var cle = teamKey(s.spec, s.cat, s.clubCode, s.numero);
    var team = etat.index[cle];
    var court = nomCourt(etat.clubMap, team.clubCode, team.numero);
    var idPlus = "equipe-plus-" + n;
    var item = el("div", { class: "rank-item" });
    var ligne = el("div", { class: "rank-ligne" });
    var bouton = el("button", {
      type: "button",
      class: "rank-row" + (s.jouees ? (PODIUM[rang] || "") : ""),
      "aria-controls": idPlus,
      "aria-label": s.jouees ? "Rang " + rang + ", " + court : court + ", pas encore classée"
    });
    bouton.appendChild(el("span", { class: "rank-pos", text: s.jouees ? String(rang) : "–" }));
    // Le numéro d'équipe ne passe jamais seul à la ligne.
    bouton.appendChild(el("span", { class: "rank-team", text: court.replace(/ (\d+)$/, " $1") }));
    var chevron = el("span", { class: "rank-chevron" });
    chevron.innerHTML = SVG_CHEVRON;
    bouton.appendChild(chevron);
    ligne.appendChild(bouton);
    ligne.appendChild(buildActions(team, court));
    item.appendChild(ligne);

    var plus = el("div", { class: "rank-plus", id: idPlus });
    item.appendChild(plus);
    function montrerDepli(ouvert) {
      if (ouvert) remplirDepli(plus, team, cle);
      bouton.setAttribute("aria-expanded", ouvert ? "true" : "false");
      item.classList.toggle("ouvert", ouvert);
      plus.hidden = !ouvert;
    }
    montrerDepli(!!deplies[cle]);
    bouton.addEventListener("click", function () {
      if (deplies[cle]) delete deplies[cle]; else deplies[cle] = true;
      montrerDepli(!!deplies[cle]);
    });
    return item;
  }

  function buildCarteListe(g, compteur) {
    var carte = el("div", { class: "poule-card" });
    var head = el("div", { class: "poule-head" });
    head.appendChild(el("span", { class: "badge serie-" + g.cat, text: SERIE_LABELS[g.cat] || ("Cat. " + (g.cat || "?")) }));
    head.appendChild(el("span", { text: g.poule ? "Poule " + g.poule : "Hors poule" }));
    if (specsMultiples()) head.appendChild(el("span", { class: "poule-sub", text: libelleSpec(g.spec) }));
    carte.appendChild(head);
    g.equipes.forEach(function (s, i) {
      carte.appendChild(buildLigneEquipe(s, i + 1, ++compteur.n));
    });
    return carte;
  }

  // ---------------------------------------------------------------
  // Message des phases finales (spec liste-equipes)
  // ---------------------------------------------------------------
  // Les libellés de PHASE_LABELS, au pluriel, pour l'en-tête d'un jour de
  // phase finale : « 1/2 finales, dimanche 29 novembre ».
  var PHASES_AU_PLURIEL = {
    "7": "1/32es de finale",
    "8": "1/16es de finale",
    "9": "1/8es de finale",
    "10": "Quarts de finale",
    "11": "1/2 finales",
    "12": "Finales"
  };
  var NOMBRES_EN_LETTRES = { 2: "deux", 3: "trois", 4: "quatre", 5: "cinq" };

  // « PARIS (Trinquet Paris - 75016) » → « Trinquet Paris (75016) ».
  function lieuMessage(lieu) {
    var brut = String(lieu || "").trim();
    var m = /\(([^)]+)\)/.exec(brut);
    if (!m) return brut;
    var parts = m[1].split(" - ");
    return parts.length > 1 ? parts[0].trim() + " (" + parts.slice(1).join(" - ").trim() + ")" : parts[0].trim();
  }

  // « Hugues SAINT-PIERRE » → « Hugues Saint-Pierre » : chaque mot et chaque
  // partie d'un nom composé avec sa majuscule, le reste en minuscules.
  function nomPropre(nom) {
    return String(nom || "").trim().toLocaleLowerCase("fr")
      .replace(/(^|[\s'’-])([^\s'’-])/g, function (tout, avant, lettre) { return avant + lettre.toLocaleUpperCase("fr"); });
  }

  // « A & B », « A, B & C ».
  function joueursDuMessage(roster) {
    var noms = (roster || []).map(nomPropre).filter(Boolean);
    if (noms.length < 2) return noms.join("");
    return noms.slice(0, -1).join(", ") + " & " + noms[noms.length - 1];
  }

  function equipeDuMessage(spec, cat, club, numero) {
    if (clubFictif(club)) return "à désigner";
    var team = etat.index[teamKey(spec, cat, club, numero)];
    var nom = nomCourt(etat.clubMap, club, numero);
    var joueurs = team ? joueursDuMessage(team.roster) : "";
    return joueurs ? nom + " (" + joueurs + ")" : nom;
  }

  function avisEnCours(aujourdHui) {
    return /^https:\/\//.test(AVIS.url) && aujourdHui <= new Date(AVIS.jusquAu + "T23:59:59");
  }

  function lienDuSite() {
    try { return new URL("decouvrir.html", window.location.href).href; } catch (e) { return ""; }
  }

  // Le message des phases finales, mis en forme pour WhatsApp, ou null quand
  // aucune partie de phase finale ne reste à jouer dans une série aux poules
  // finies. Renvoie aussi le premier et le dernier jour, pour la note du bloc.
  function messagePhasesFinales(rencontres, aujourdHui, lienSite) {
    // Même clé de série que masquerFinalesPrematurees.
    function serie(r) {
      return [r["Compétition"], r["Spécialité"], r["Catégorie"]]
        .map(function (v) { return String(v || "").trim(); }).join("|");
    }
    var poulesEnCours = {};
    rencontres.forEach(function (r) {
      if (estPhaseDePoules(r) && !hasScore(r)) poulesEnCours[serie(r)] = true;
    });
    var parties = rencontres.filter(function (r) {
      return PHASES_A_DESIGNER.indexOf(String(r.Phase || "").trim()) !== -1 && !hasScore(r) && !poulesEnCours[serie(r)];
    }).map(function (r) {
      var t = parseHeureRenc(r.heure_renc);
      return { r: r, date: effectiveDate(r), hour: t ? t.hour : null, minute: t ? t.minute : 0, phase: String(r.Phase).trim() };
    }).filter(function (p) { return p.date && p.date >= aujourdHui; });
    if (!parties.length) return null;
    // Par jour, puis par phase (un seul en-tête par phase et par jour, même
    // quand les séries s'entrecroisent), puis par heure.
    parties.sort(function (a, b) {
      return a.date - b.date || Number(a.phase) - Number(b.phase) ||
             (a.hour === null ? 99 : a.hour) * 60 + a.minute - ((b.hour === null ? 99 : b.hour) * 60 + b.minute);
    });

    var lieux = {};
    parties.forEach(function (p) { lieux[lieuMessage(p.r.lieu_renc)] = true; });
    var lieuUnique = Object.keys(lieux).length === 1 ? Object.keys(lieux)[0] : null;
    var jours = {};
    parties.forEach(function (p) { jours[p.date.getTime()] = true; });
    var nbJours = Object.keys(jours).length;

    var lignes = [
      "🙏 *Merci à toutes et à tous pour ce championnat d'Île-de-France de Trinquet Pala Gomme Pleine !*",
      "",
      "La saison touche à sa fin et il reste " +
        (nbJours === 1 ? "un dernier rendez-vous" : (NOMBRES_EN_LETTRES[nbJours] || nbJours) + " rendez-vous") +
        " à ne pas manquer. Venez nombreux encourager les équipes 👏"
    ];
    var debutParties = lignes.length;
    var groupe = null, precedente = null;
    parties.forEach(function (p) {
      var cle = p.phase + "|" + p.date.getTime();
      if (cle !== groupe) {
        groupe = cle;
        precedente = null;
        lignes.push("", (p.phase === "12" ? "🏆" : "🏟️") + " *" + PHASES_AU_PLURIEL[p.phase] + ", " +
                    p.date.toLocaleDateString("fr-FR", { weekday: "long", day: "numeric", month: "long" }) + "*");
      }
      var r = p.r;
      var spec = String(r["Spécialité"] || "").trim(), cat = String(r["Catégorie"] || "").trim();
      var heure = p.hour !== null ? formatHour(p.hour, p.minute) : "heure à venir";
      var serie = SERIE_LABELS[cat] || ("Cat. " + (cat || "?"));
      var lieu = lieuUnique === null && lieuMessage(r.lieu_renc) ? " · " + lieuMessage(r.lieu_renc) : "";
      if (clubFictif(r.club_rec) && clubFictif(r.club_vis)) {
        if (precedente === "detail") lignes.push("");
        lignes.push("• " + heure + " : " + (PHASE_LABELS[p.phase] || "").toLocaleLowerCase("fr") + " " + serie + lieu);
        precedente = "puce";
      } else {
        lignes.push("", "*" + heure + " · " + serie + lieu + "*",
                    equipeDuMessage(spec, cat, String(r.club_rec || "").trim(), String(r.equip_rec || "").trim()),
                    "vs " + equipeDuMessage(spec, cat, String(r.club_vis || "").trim(), String(r.equip_vis || "").trim()));
        precedente = "detail";
      }
    });
    if (lieuUnique) lignes.push("", "📍 " + lieuUnique);
    // Les parties seules, pour la balise {phases finales} des textes perso.
    var lignesParties = lignes.slice(debutParties).join("\n").trim();
    if (avisEnCours(aujourdHui)) {
      lignes.push("", "💬 *Votre avis compte* : 2 minutes pour préparer la prochaine saison", AVIS.url);
    }
    if (lienSite) {
      lignes.push("", "📱 *Résultats, classements et parties sur téléphone* (site non officiel, en bêta, en complément de celui de la ligue) :", lienSite);
    }
    lignes.push("", "À très vite au bord du trinquet ! 💪");
    return { texte: lignes.join("\n"), parties: lignesParties, premiere: parties[0].date, derniere: parties[parties.length - 1].date };
  }

  // ---------------------------------------------------------------
  // Communications de l'organisateur (spec communications-equipes)
  // ---------------------------------------------------------------
  // Les balises qu'un texte peut porter, remplies pour l'équipe de la ligne
  // par valeurs(). Elles s'écrivent entre accolades ; casse, accents et
  // espaces en trop n'y changent rien ({Équipe} vaut {equipe}).
  var BALISES = [
    "responsable", "equipe", "equipe officielle", "serie", "poule", "rang", "joueurs",
    "date", "heure", "lieu", "adversaire", "joueurs adversaire", "responsable adversaire", "tel adversaire",
    "lien site", "lien questionnaire", "phases finales"
  ];

  // Le message « Prochaine partie » : celui qu'envoyait la page Parties,
  // adressé au responsable de l'équipe pour vérifier sa prochaine partie.
  // Chaque élément absent des données de la ligue est omis plutôt qu'écrit à
  // vide. masque : numéro adverse masqué, pour l'aperçu seulement.
  var DAY_NAMES = ["dimanche", "lundi", "mardi", "mercredi", "jeudi", "vendredi", "samedi"];
  var MONTH_NAMES = ["janvier", "février", "mars", "avril", "mai", "juin", "juillet", "août", "septembre", "octobre", "novembre", "décembre"];

  function formatDateLongue(d) {
    return DAY_NAMES[d.getDay()] + " " + d.getDate() + " " + MONTH_NAMES[d.getMonth()] + " " + d.getFullYear();
  }

  function messageProchainePartie(team, ctx, masque) {
    var m = prochainePartie(team, ctx.aujourdHui);
    if (!m) return "";
    var adv = etat.index[teamKey(team.spec, team.cat, m.clubAdv, m.numAdv)];
    var resp = team.contact ? prenomDuResponsable(team.contact.responsable) : "";
    var quand = "est prévue le *" + formatDateLongue(m.date) + " à " + formatHour(m.hour, m.minute) + "*";

    // Un adversaire pas encore désigné se nomme comme sur Parties, sans numéro.
    var nomAdv = clubFictif(m.clubAdv) ? (etat.clubMap[m.clubAdv] || "Equipe à désigner") : m.adversaire;
    var rencontre = ["Votre partie", clubLabel(etat.clubMap, team.clubCode, team.numero) + " vs " + nomAdv];
    // Le point ferme la phrase sur la dernière ligne réellement écrite :
    // sans lieu connu, c'est la ligne date/heure.
    rencontre.push(quand + (m.lieu ? "" : "."));
    if (m.lieu) rencontre.push("à " + m.lieu + ".");

    var blocs = [
      "Bonjour" + (resp ? " " + resp : "") + ",",
      rencontre.join("\n"),
      "Tout est bon de votre côté ?"
    ];

    var autreResp = adv && adv.contact ? String(adv.contact.responsable || "").trim() : "";
    var autreTel = adv && adv.contact ? (telLisible(adv.contact.tel) || "") : "";
    // Masqué, en espaces insécables : le numéro ne se coupe pas en fin de ligne.
    if (autreTel && masque) autreTel = masquerTel(autreTel).replace(/ /g, "\u00a0");
    if (autreResp || autreTel) {
      blocs.push("Responsable adverse : " + (autreResp && autreTel ? autreResp + " (" + autreTel + ")" : (autreResp || autreTel)) + ".");
    }

    var finales = rappelPhasesFinales(team, m);
    if (finales) blocs.push(finales);

    // Rappel de contexte en italique WhatsApp (_.._), en fin de message.
    var contexte = [
      COMPET_LABELS[m.competRaw] || "",
      SPEC_LABELS[team.spec] || "",
      team.serieLabel + (m.meta ? " - " + m.meta : "")
    ].filter(function (part) { return !!part; }).join(", ");
    if (contexte) blocs.push("_" + contexte + "_");

    blocs.push("Merci.");
    return blocs.join("\n\n");
  }

  // Pendant la phase de poules, on prévient que les phases finales ne se
  // reportent pas, avec leurs dates (sans les créneaux), lues dans les
  // parties de 1/4, 1/2 et finale de la même compétition, spécialité et
  // série. Une phase sans partie datée est omise ; sans aucune, pas de rappel.
  var RAPPEL_FINALES = [["10", "1/4"], ["11", "1/2"], ["12", "finales"]];

  function rappelPhasesFinales(team, m) {
    if (m.phaseRaw !== "1") return null;
    var parties = RAPPEL_FINALES.map(function (phase) {
      var jours = [];
      etat.data.rencontres.forEach(function (row) {
        if (String(row.Phase || "").trim() !== phase[0] ||
            String(row["Catégorie"] || "").trim() !== team.cat ||
            String(row["Spécialité"] || "").trim() !== team.spec ||
            String(row["Compétition"] || "").trim() !== m.competRaw) return;
        var d = effectiveDate(row);
        if (!d || !parseHeureRenc(row.heure_renc)) return;
        var jour = DAY_NAMES[d.getDay()].slice(0, 3) + ". " + d.getDate() + "/" + (d.getMonth() + 1);
        if (jours.indexOf(jour) === -1) jours.push(jour);
      });
      return jours.length ? phase[1] + " : " + jours.join(" et ") : null;
    }).filter(function (partie) { return !!partie; });
    if (!parties.length) return null;
    var liste = parties.length > 1 ? parties.slice(0, -1).join(", ") + " et " + parties[parties.length - 1] : parties[0];
    return "Noter qu'il n'est pas possible de reporter les phases finales.\n" + liste + ".";
  }

  // Le texte d'exemple de « Perso », montré tant que l'organisateur n'a rien
  // écrit, et rétabli par son bouton : le message « Prochaine partie » en
  // balises, plus le lien du site.
  var EXEMPLE_PERSO = [
    "Bonjour {responsable},",
    "",
    "Votre partie",
    "{equipe officielle} vs {adversaire}",
    "est prévue le *{date} à {heure}*",
    "📍 {lieu}",
    "",
    "Tout est bon de votre côté ?",
    "",
    "Responsable adverse : {responsable adversaire}, {tel adversaire}",
    "",
    "Résultats et classements : {lien site}",
    "",
    "Merci."
  ].join("\n");

  var PERSO_KEY = "lidfpb_message_perso_v1";

  // Le texte perso reste dans le navigateur ; sans stockage, il vit le temps
  // de la visite.
  var textePerso = null;
  function lirePerso() {
    if (textePerso === null) {
      // Un texte vidé reste vide : seule une absence de texte rend l'exemple.
      try {
        var garde = localStorage.getItem(PERSO_KEY);
        textePerso = garde === null ? EXEMPLE_PERSO : garde;
      } catch (e) { textePerso = EXEMPLE_PERSO; }
    }
    return textePerso;
  }
  function ecrirePerso(texte) {
    textePerso = texte;
    try { localStorage.setItem(PERSO_KEY, texte); } catch (e) { /* pas bloquant */ }
  }
  function retablirPerso() {
    textePerso = EXEMPLE_PERSO;
    try { localStorage.removeItem(PERSO_KEY); } catch (e) { /* pas bloquant */ }
  }

  function nomDeBalise(brut) {
    return String(brut || "").normalize("NFD").replace(/[̀-ͯ]/g, "")
      .toLowerCase().replace(/\s+/g, " ").trim();
  }

  // « 06 12 34 56 78 » → « 06 •• •• •• 78 » : l'aperçu ne montre jamais un
  // numéro entier (spec donnees-api).
  function masquerTel(tel) {
    var total = (String(tel).match(/\d/g) || []).length, vu = 0;
    return String(tel).replace(/\d/g, function (d) {
      vu += 1;
      return vu <= 2 || vu > total - 2 ? d : "•";
    });
  }

  // Les valeurs des balises pour une équipe. masque : numéros masqués, pour
  // l'aperçu seulement.
  function valeurs(team, ctx, masque) {
    var p = pouleDe(etat.standings, team);
    var m = prochainePartie(team, ctx.aujourdHui);
    var adv = m ? etat.index[teamKey(team.spec, team.cat, m.clubAdv, m.numAdv)] : null;
    var tel = adv && adv.contact ? telLisible(adv.contact.tel) : null;
    return {
      "responsable": team.contact ? prenomDuResponsable(team.contact.responsable) : "",
      "equipe": nomCourt(etat.clubMap, team.clubCode, team.numero),
      "equipe officielle": clubLabel(etat.clubMap, team.clubCode, team.numero),
      "serie": team.serieLabel,
      "poule": team.poule,
      "rang": p ? rangEnClair(p) : "",
      "joueurs": joueursDuMessage(team.roster),
      "date": m ? m.date.toLocaleDateString("fr-FR", { weekday: "long", day: "numeric", month: "long" }) : "",
      "heure": m ? formatHour(m.hour, m.minute) : "",
      "lieu": m ? lieuMessage(m.lieu) : "",
      "adversaire": m ? (clubFictif(m.clubAdv) ? "à désigner" : nomCourt(etat.clubMap, m.clubAdv, m.numAdv)) : "",
      "joueurs adversaire": adv ? joueursDuMessage(adv.roster) : "",
      "responsable adversaire": adv && adv.contact ? String(adv.contact.responsable || "").trim() : "",
      // Masqué, en espaces insécables : le numéro ne se coupe pas en fin de ligne.
      "tel adversaire": tel ? (masque ? masquerTel(tel).replace(/ /g, "\u00a0") : tel) : "",
      "lien site": ctx.lienSite,
      "lien questionnaire": avisEnCours(ctx.aujourdHui) ? AVIS.url : "",
      "phases finales": ctx.finales ? ctx.finales.parties : ""
    };
  }

  // Remplit les balises, ligne par ligne. Une ligne dont une balise connue est
  // vide disparaît ; une balise inconnue reste écrite telle quelle. Les lignes
  // vides en trop qui en résultent sont fusionnées.
  function remplir(texte, vals) {
    return String(texte || "").split("\n").map(function (ligne) {
      var vide = false;
      var sortie = ligne.replace(/\{([^{}\n]+)\}/g, function (tout, nom) {
        var k = nomDeBalise(nom);
        if (!Object.prototype.hasOwnProperty.call(vals, k)) return tout;
        if (!vals[k]) { vide = true; return ""; }
        return vals[k];
      });
      return vide ? null : sortie;
    }).filter(function (l) { return l !== null; })
      .join("\n").replace(/\n{3,}/g, "\n\n").trim();
  }

  function balisesInconnues(texte) {
    var vues = [];
    String(texte || "").replace(/\{([^{}\n]+)\}/g, function (tout, nom) {
      if (BALISES.indexOf(nomDeBalise(nom)) === -1 && vues.indexOf(tout) === -1) vues.push(tout);
      return tout;
    });
    return vues;
  }

  // Les communications : quand elles sont proposées, quelles équipes elles
  // concernent, et leur texte pour une équipe. Ajouter « Fin de poule »,
  // c'est ajouter une entrée.
  function toujours() { return true; }
  var COMMUNICATIONS = [
    {
      id: "finales", nom: "Phases finales",
      proposee: function (ctx) { return !!ctx.finales; },
      concerne: toujours,
      texte: function (team, ctx) { return ctx.finales.texte; },
      note: function (ctx) {
        var f = ctx.finales;
        var quand = formatShortDate(f.premiere) +
          (f.derniere.getTime() !== f.premiere.getTime() ? " au " + formatShortDate(f.derniere) : "");
        return "Phases finales du " + quand + " : un message avec les parties, les joueurs, le questionnaire d'avis et le site.";
      }
    },
    {
      id: "prochaine", nom: "Prochaine partie",
      proposee: function (ctx) {
        return Object.keys(etat.index).some(function (k) { return !!prochainePartie(etat.index[k], ctx.aujourdHui); });
      },
      concerne: function (team, ctx) { return !!prochainePartie(team, ctx.aujourdHui); },
      texte: function (team, ctx, masque) { return messageProchainePartie(team, ctx, masque); },
      note: function (ctx) {
        var n = Object.keys(etat.index).filter(function (k) {
          return equipeAffichee(etat.index[k]) && !!prochainePartie(etat.index[k], ctx.aujourdHui);
        }).length;
        if (!n) return "Aucune équipe affichée n'a de partie à venir : changez les filtres pour en voir.";
        return pluriel(n, "équipe") + " " + (n > 1 ? "ont" : "a") + " une partie à venir : chacune reçoit la sienne, avec la question « Tout est bon de votre côté ? » et le responsable adverse.";
      }
    },
    {
      id: "perso", nom: "Perso",
      proposee: toujours,
      concerne: toujours,
      texte: function (team, ctx, masque) { return remplir(lirePerso(), valeurs(team, ctx, masque)); },
      note: function () { return "Votre texte, avec des balises remplies pour chaque équipe. Il est gardé sur cet appareil."; }
    }
  ];

  // La communication choisie et l'équipe de l'aperçu valent le temps de la
  // visite. etatCom : le contexte du dernier rendu de la liste et son bloc.
  var communicationChoisie = null;
  var apercuCle = null;
  var etatCom = null;
  // Les avions en papier de la liste, tenus à jour sans la redessiner.
  var envois = [];
  var minuteurEnvois = null;

  function communicationCourante() {
    return COMMUNICATIONS.filter(function (c) { return c.id === communicationChoisie; })[0];
  }

  function majEnvois() {
    if (!etatCom) return;
    var com = communicationCourante();
    envois.forEach(function (e) {
      var ok = com.concerne(e.team, etatCom.ctx);
      e.a.hidden = !ok;
      if (!ok) return;
      var label = "Envoyer « " + com.nom + " » au responsable de " + e.court;
      e.a.href = lienWhatsappAvecTexte(e.numero, com.texte(e.team, etatCom.ctx, false));
      e.a.title = label;
      e.a.setAttribute("aria-label", label);
    });
  }

  function majEnvoisBientot() {
    clearTimeout(minuteurEnvois);
    minuteurEnvois = setTimeout(function () { minuteurEnvois = null; majEnvois(); }, 150);
  }

  // Les équipes que la communication concerne, pour l'aperçu : par série,
  // puis par nom court ; « Alpha 1 · Série 1 » distingue deux homonymes.
  function equipesDeLApercu(com) {
    var multiples = specsMultiples();
    return Object.keys(etat.index).filter(function (k) {
      return equipeAffichee(etat.index[k]) && com.concerne(etat.index[k], etatCom.ctx);
    })
      .map(function (k) {
        var t = etat.index[k];
        return { cle: k, t: t, nom: nomCourt(etat.clubMap, t.clubCode, t.numero) + " · " + t.serieLabel +
                                  (multiples ? " · " + libelleSpec(t.spec) : "") };
      })
      .sort(function (a, b) {
        return a.t.spec.localeCompare(b.t.spec, "fr", { numeric: true }) ||
               a.t.cat.localeCompare(b.t.cat, "fr", { numeric: true }) || a.nom.localeCompare(b.nom, "fr", { numeric: true });
      });
  }

  // Le bloc en tête de la liste : pastilles, note, puis, déplié par « Message
  // aux équipes », l'éditeur de « Perso », l'aperçu et Partager. Pas de
  // fenêtre surgissante (README, « Choix assumés »).
  function buildCommunications() {
    var ctx = etatCom.ctx;
    var proposees = COMMUNICATIONS.filter(function (c) { return c.proposee(ctx); });
    if (!proposees.some(function (c) { return c.id === communicationChoisie; })) communicationChoisie = proposees[0].id;
    var com = communicationCourante();

    var bloc = el("section", { class: "message-equipes", "aria-label": "Communication aux équipes" });
    bloc.appendChild(el("div", { class: "prevenir-titre", text: "Communication aux équipes" }));
    var choix = el("div", { class: "communication-choix", role: "group", "aria-label": "Communication à envoyer" });
    proposees.forEach(function (c) {
      var pastille = el("button", { type: "button", class: "mes-chip", "aria-pressed": String(c.id === com.id), text: c.nom });
      pastille.addEventListener("click", function () {
        if (c.id === communicationChoisie) return;
        communicationChoisie = c.id;
        redessinerCommunications();
        majEnvois();
      });
      choix.appendChild(pastille);
    });
    bloc.appendChild(choix);
    bloc.appendChild(el("div", {
      class: "prevenir-note",
      text: com.note(ctx) + " L'avion en papier d'une ligne l'envoie au responsable de l'équipe sur WhatsApp."
    }));

    var bouton = el("button", { type: "button", class: "prevenir-btn message-btn", "aria-expanded": String(messageOuvert), "aria-controls": "message-corps" });
    bouton.appendChild(el("span", { text: "Message aux équipes" }));
    var chevron = el("span", { class: "rank-chevron" });
    chevron.innerHTML = SVG_CHEVRON;
    bouton.appendChild(chevron);
    bloc.appendChild(bouton);

    var corps = el("div", { id: "message-corps", class: "communication-corps" });
    corps.hidden = !messageOuvert;

    // L'équipe de l'aperçu : celle déjà choisie si elle est concernée, sinon
    // la première équipe suivie concernée, sinon la première de la liste.
    var equipes = equipesDeLApercu(com);
    var cles = equipes.map(function (e) { return e.cle; });
    if (cles.indexOf(apercuCle) === -1) {
      apercuCle = etat.suivies.filter(function (k) { return cles.indexOf(k) !== -1; })[0] || cles[0] || null;
    }
    var apercu = el("pre", { class: "message-apercu" });
    function texteApercu(masque) {
      var team = apercuCle ? etat.index[apercuCle] : null;
      return team ? com.texte(team, ctx, masque) : "";
    }
    function majApercu() {
      apercu.textContent = equipes.length ? texteApercu(true) : "Aucune équipe affichée n'est concernée.";
    }

    if (com.id === "perso") {
      corps.appendChild(el("label", { for: "message-perso", text: "Texte du message" }));
      var champ = el("textarea", { id: "message-perso", class: "message-perso", spellcheck: "true" });
      champ.value = lirePerso();
      corps.appendChild(champ);
      var balises = el("div", { class: "balises", role: "group", "aria-label": "Insérer une balise" });
      BALISES.forEach(function (b) {
        var btn = el("button", { type: "button", class: "balise-btn", text: "{" + b + "}" });
        btn.addEventListener("click", function () {
          champ.setRangeText("{" + b + "}", champ.selectionStart, champ.selectionEnd, "end");
          champ.focus();
          surSaisie();
        });
        balises.appendChild(btn);
      });
      corps.appendChild(balises);
      var inconnues = el("div", { class: "balise-inconnue", "aria-live": "polite" });
      corps.appendChild(inconnues);
      var retablir = el("button", { type: "button", class: "lien-discret", text: "Rétablir l'exemple" });
      retablir.addEventListener("click", function () {
        retablirPerso();
        champ.value = lirePerso();
        majInconnues();
        majApercu();
        majEnvois();
      });
      corps.appendChild(retablir);
      var majInconnues = function () {
        var liste = balisesInconnues(champ.value);
        inconnues.textContent = liste.length ? "Balise inconnue : " + liste.join(", ") : "";
      };
      var surSaisie = function () {
        ecrirePerso(champ.value);
        majInconnues();
        majApercu();
        majEnvoisBientot();
      };
      champ.addEventListener("input", surSaisie);
      majInconnues();
    }

    if (equipes.length) {
      corps.appendChild(el("label", { for: "apercu-equipe", text: "Aperçu pour" }));
      var select = el("select", { id: "apercu-equipe", class: "apercu-equipe" });
      equipes.forEach(function (e) { select.appendChild(el("option", { value: e.cle, text: e.nom })); });
      select.value = apercuCle;
      select.addEventListener("change", function () {
        apercuCle = select.value;
        majApercu();
      });
      corps.appendChild(select);
    }
    majApercu();
    corps.appendChild(apercu);
    var btns = el("div", { class: "prevenir-btns" });
    // Sans équipe affichée concernée, rien à partager : pas de bouton.
    if (equipes.length) {
      var partage = boutonPartager(function () { return texteApercu(false); });
      btns.appendChild(partage.bouton);
      btns.appendChild(partage.info);
    }
    corps.appendChild(btns);
    bloc.appendChild(corps);

    bouton.addEventListener("click", function () {
      messageOuvert = !messageOuvert;
      bouton.setAttribute("aria-expanded", String(messageOuvert));
      corps.hidden = !messageOuvert;
    });
    return bloc;
  }

  // Changer de pastille ne redessine que le bloc : la liste, ses lignes
  // dépliées et le défilement ne bougent pas.
  function redessinerCommunications() {
    var nouveau = buildCommunications();
    etatCom.bloc.replaceWith(nouveau);
    etatCom.bloc = nouveau;
  }

  function renderListe() {
    document.querySelector(".recap-card").hidden = false;
    renderSpecChips();
    // Un rafraîchissement des données peut redessiner la liste pendant que
    // l'organisateur écrit dans « Perso » : le champ retrouve son curseur.
    var champ = document.activeElement && document.activeElement.id === "message-perso" ? document.activeElement : null;
    var curseur = champ ? [champ.selectionStart, champ.selectionEnd] : null;
    var results = document.getElementById("results");
    results.innerHTML = "";
    var chips = buildMesChips("");
    if (chips) results.appendChild(chips);
    envois = [];
    etatCom = null;
    if (ORGA) {
      var aujourdHui = startOfDay(new Date());
      var lienSite = lienDuSite();
      etatCom = { ctx: { aujourdHui: aujourdHui, lienSite: lienSite,
                         finales: messagePhasesFinales(etat.data.rencontres, aujourdHui, lienSite) } };
      etatCom.bloc = buildCommunications();
      results.appendChild(etatCom.bloc);
    }
    var liste = el("div", { class: "liste-equipes liste-cartes" });
    var compteur = { n: 0 };
    var groupes = groupesDeLaListe();
    groupes.forEach(function (g) {
      liste.appendChild(buildCarteListe(g, compteur));
    });
    results.appendChild(liste);
    if (!groupes.length) results.appendChild(el("div", { class: "empty-state", text: "Aucune équipe ne correspond aux filtres." }));
    majEnvois();
    var nouveauChamp = curseur ? document.getElementById("message-perso") : null;
    if (nouveauChamp) {
      nouveauChamp.focus({ preventScroll: true });
      nouveauChamp.setSelectionRange(curseur[0], curseur[1]);
    }
  }

  // ---------------------------------------------------------------
  // Navigation entre la liste et une équipe
  // ---------------------------------------------------------------
  // L'adresse décide : une équipe connue, sa page ; sinon la liste. Une
  // équipe inconnue (lien d'une autre saison) sort de l'adresse, sans message.
  function afficherSelonAdresse() {
    var demandee = equipeDansLAdresse();
    var cle = demandee && etat.index[demandee] ? demandee : "";
    // Une équipe inconnue quitte l'adresse, et « orga » aussi une fois gardé
    // par le navigateur.
    mettreAJourAdresse(cle);
    etat.cle = cle;
    if (cle) renderEquipe(cle); else renderListe();
  }

  // Depuis la liste, l'équipe s'ajoute à l'historique : Retour ramène à la
  // liste. D'une équipe à l'autre (pastilles), l'adresse est remplacée, et
  // l'état « venu de la liste » est gardé.
  function ouvrirEquipe(cle, depuisListe) {
    var url = window.location.pathname + requete(cle);
    try {
      if (depuisListe) history.pushState({ depuisListe: true }, "", url);
      else history.replaceState(history.state, "", url);
    } catch (e) { /* adresse inchangée : pas bloquant */ }
    etat.cle = cle;
    renderEquipe(cle);
    window.scrollTo({ top: 0 });
  }

  // Venu de la liste, on y retourne par l'historique ; arrivé par un lien
  // partagé, la liste s'ajoute à l'historique.
  function revenirALaListe() {
    if (history.state && history.state.depuisListe) { history.back(); return; }
    try { history.pushState(null, "", window.location.pathname + requete("")); } catch (e) { /* pas bloquant */ }
    etat.cle = "";
    renderListe();
    window.scrollTo({ top: 0 });
  }

  function renderEquipe(cle) {
    // La page d'une équipe n'a pas de filtres.
    document.querySelector(".recap-card").hidden = true;
    var results = document.getElementById("results");
    results.innerHTML = "";
    var team = etat.index[cle];
    var retour = el("a", { class: "retour-liste", href: adresse(""), text: "← Toutes les équipes" });
    retour.addEventListener("click", function (ev) {
      ev.preventDefault();
      revenirALaListe();
    });
    results.appendChild(retour);
    var chips = buildMesChips(cle);
    if (chips) results.appendChild(chips);

    // Trois colonnes sur grand écran (l'équipe, ses parties, le reste à
    // jouer de la poule), empilées dans cet ordre sur téléphone.
    var p = pouleDe(etat.standings, team);
    var colonnes = el("div", { class: "colonnes" });
    colonnes.appendChild(el("div", { class: "colonne" }, [
      buildEnTete(team, p), buildBilan(team, p), buildProchaine(team)
    ]));
    colonnes.appendChild(el("div", { class: "colonne" }, [buildParties(team)]));
    if (p) {
      var reste = resteAJouer(etat.data.rencontres, etat.clubMap, p, cle);
      if (reste.length) colonnes.appendChild(el("div", { class: "colonne" }, [buildReste(reste)]));
    }
    results.appendChild(colonnes);
  }

  // Une pastille par équipe suivie, dans l'ordre où elles ont été suivies.
  // Inutile quand la seule équipe suivie est déjà à l'écran.
  function buildMesChips(cle) {
    var mes = etat.suivies.filter(function (k) { return etat.index[k]; });
    if (!mes.length || (mes.length === 1 && mes[0] === cle)) return null;
    var rang = el("div", { class: "mes-chips", role: "group", "aria-label": "Mes équipes suivies" });
    mes.forEach(function (k) {
      var t = etat.index[k];
      var chip = el("button", {
        type: "button", class: "mes-chip",
        text: clubLabel(etat.clubMap, t.clubCode, t.numero) + " · " + t.serieLabel
      });
      if (k === cle) chip.setAttribute("aria-current", "true");
      chip.addEventListener("click", function () {
        if (k === etat.cle) return;
        ouvrirEquipe(k, !etat.cle);
      });
      rang.appendChild(chip);
    });
    return rang;
  }

  var etat = { data: null, clubMap: null, index: null, standings: null, suivies: [], cle: "" };

  // ---------------------------------------------------------------
  // Orchestration
  // ---------------------------------------------------------------
  function formatTime(ts) {
    var d = new Date(ts);
    return d.toLocaleDateString("fr-FR") + " à " + d.toLocaleTimeString("fr-FR", { hour: "2-digit", minute: "2-digit" });
  }

  function formatSync(iso) {
    if (!iso) return null;
    var d = new Date(iso);
    if (Number.isNaN(d.getTime())) return null;
    return formatTime(d.getTime());
  }

  function run(forceRefresh) {
    var lastSyncText = document.getElementById("lastSyncText");
    var bannerSlot = document.getElementById("banner-slot");
    var results = document.getElementById("results");
    bannerSlot.innerHTML = "";
    lastSyncText.textContent = "chargement…";

    function afficher(data) {
      bannerSlot.innerHTML = "";
      lastSyncText.textContent = formatSync(data.lastSync) || "information indisponible";
      etat.data = data;
      etat.clubMap = buildClubMap(data.clubs);
      etat.index = equipesChoisissables(buildTeams(data.rencontres, etat.clubMap, {
        numeroClubMap: buildNumeroClubMap(data.clubs),
        licenceMap: buildLicenceMap(data.licencies),
        engagementsIndex: buildEngagementsIndex(data.engagements)
      }));
      etat.standings = buildStandings(data.rencontres, etat.clubMap);
      etat.suivies = lireMesEquipes();
      // L'adresse désigne toujours ce qui est à l'écran : après un
      // rafraîchissement, la même vue revient.
      afficherSelonAdresse();
    }

    // 1) Ce que le cache sait déjà est affiché tout de suite, sans attendre le
    //    réseau : l'API met environ deux secondes à répondre, et la source ne
    //    se synchronise qu'une fois par nuit.
    var holder = {};
    var rendu = false;
    var signatureRendue = null;

    fetchLiveData(viaCache(holder)).then(function (data) {
      afficher(data);
      rendu = true;
      signatureRendue = signature(data);
    }).catch(function () {
      // Cache incomplet : il n'y a rien à afficher avant la réponse réseau.
    }).then(function () {
      // 2) Rafraîchissement, sauf si le cache vient tout juste d'être écrit.
      if (rendu && !forceRefresh && (Date.now() - holder.fetchedAt) < CACHE_TTL_MS) return;

      var skeletonTimer = rendu ? null : setTimeout(function () { renderSkeleton(results); }, 150);

      return fetchLiveData(viaReseau(forceRefresh ? 0 : CACHE_TTL_MS)).then(function (data) {
        if (skeletonTimer) clearTimeout(skeletonTimer);
        if (!rendu || signature(data) !== signatureRendue) afficher(data);
        else lastSyncText.textContent = formatSync(data.lastSync) || "information indisponible";
      }).catch(function (err) {
        if (skeletonTimer) clearTimeout(skeletonTimer);
        var message = err && err.message ? err.message : String(err);
        if (rendu) {
          renderBanner(bannerSlot, "warn", "Données non rafraîchies",
            "Le dernier appel à l'API a échoué (" + message + "). " +
            "Les données affichées datent du " + formatTime(holder.fetchedAt) + " et peuvent être obsolètes.");
        } else {
          results.innerHTML = "";
          lastSyncText.textContent = "échec du chargement";
          renderBanner(bannerSlot, "error", "Impossible d'afficher l'équipe",
            message + " — par sécurité, rien n'est affiché : les données seraient potentiellement incomplètes.");
        }
      });
    });
  }

  // ---------------------------------------------------------------
  // Démarrage
  // ---------------------------------------------------------------
  // Pied de page : le lien d'entrée en mode organisateur, ou, une fois dedans,
  // le bouton pour en sortir.
  if (ORGA) {
    var piedOrga = document.getElementById("piedOrga");
    piedOrga.innerHTML = "";
    var quitter = el("button", { type: "button", text: "Quitter le mode organisateur" });
    quitter.addEventListener("click", quitterOrga);
    piedOrga.appendChild(quitter);
  }

  // Retour et Avancer du navigateur, entre la liste et une équipe.
  window.addEventListener("popstate", function () {
    if (etat.index) afficherSelonAdresse();
  });
  document.getElementById("refreshBtn").addEventListener("click", function () { run(true); });
  setupFilters();
  document.getElementById("backToTopBtn").addEventListener("click", function () {
    window.scrollTo({ top: 0, behavior: "smooth" });
  });
  run(false);
})();
</script>
<script>
(function () {
  "use strict";

  // Le pli du bloc Filtres est commun à toutes les pages : replié dans la vue
  // « par date », il le reste après la bascule vers « par équipe ».
  var CLE_PLI = "lidfpb_filters_open_v1";
  var bouton = document.getElementById("filtersToggle");
  var corps = document.getElementById("filtersBody");
  if (!bouton || !corps) return;

  // Replié, le bloc garde sous son titre ce qui est filtré : seulement ce qui
  // s'écarte du réglage par défaut, et au plus RECAP_MAX éléments, la suite
  // comptée (« +2 »). Dans un groupe, la liste la plus courte l'emporte :
  // « sans 17h » plutôt que les six autres heures.
  var RECAP_MAX = 3;
  var recap = document.createElement("span");
  recap.className = "filters-recap";
  bouton.querySelector("span").appendChild(recap);

  function libelle(e) { return e.getAttribute("data-recap") || e.textContent.trim(); }

  function elementsRecap() {
    var liste = [];
    corps.querySelectorAll(".filter-group").forEach(function (g) {
      // Une pastille cachée (heure impossible pour les jours choisis) ne
      // compte pas.
      var chips = [].slice.call(g.querySelectorAll(".filter-chip")).filter(function (c) { return !c.hidden; });
      var actives = chips.filter(function (c) { return c.classList.contains("active"); });
      var autres = chips.filter(function (c) { return !c.classList.contains("active"); });
      if (g.hasAttribute("data-recap-choix")) {
        // Un seul choix parmi plusieurs : rien à dire tant que c'est le défaut.
        actives.forEach(function (c) { if (!c.hasAttribute("data-recap-defaut")) liste.push(libelle(c)); });
      } else if (g.hasAttribute("data-recap-bascule")) {
        // Une pastille seule qui s'allume, comme « Masquer les parties passées ».
        actives.forEach(function (c) { liste.push(libelle(c)); });
      } else if (!actives.length && chips.length) {
        liste.push(g.getAttribute("data-recap-vide") || "rien");
      } else if (autres.length && autres.length < actives.length) {
        liste.push("sans " + autres.map(libelle).join(", "));
      } else if (autres.length) {
        actives.forEach(function (c) { liste.push(libelle(c)); });
      }
    });
    corps.querySelectorAll(".filter-checkbox").forEach(function (l) {
      var coche = l.querySelector("input").checked;
      var texte = l.getAttribute(coche ? "data-recap" : "data-recap-off");
      if (texte) liste.push(texte);
    });
    return liste;
  }

  function majRecap() {
    var liste = elementsRecap();
    var texte = liste.length ? liste.slice(0, RECAP_MAX).join(" · ") : "Tout est affiché";
    if (liste.length > RECAP_MAX) texte += " · +" + (liste.length - RECAP_MAX);
    recap.textContent = texte;
  }

  function appliquer(ouvert) {
    bouton.setAttribute("aria-expanded", ouvert ? "true" : "false");
    corps.hidden = !ouvert;
    recap.hidden = ouvert;
    if (!ouvert) majRecap();
  }

  // Les pastilles changent au toucher, ou sont reconstruites à l'arrivée des
  // données : le résumé suit dans les deux cas.
  if (window.MutationObserver) {
    new MutationObserver(majRecap).observe(corps, { subtree: true, childList: true, attributes: true, attributeFilter: ["class", "hidden"] });
  }
  corps.addEventListener("change", majRecap);

  // Replié par défaut, pour laisser l'écran aux résultats : seul un geste du
  // visiteur l'ouvre, et il reste ouvert sur les quatre pages tant qu'il ne
  // l'a pas refermé.
  var ouvert = false;
  try { if (localStorage.getItem(CLE_PLI) === "1") ouvert = true; } catch (e) { /* stockage indisponible : on reste replié */ }
  appliquer(ouvert);

  bouton.addEventListener("click", function () {
    ouvert = !ouvert;
    appliquer(ouvert);
    try { localStorage.setItem(CLE_PLI, ouvert ? "1" : "0"); } catch (e) { /* pas bloquant */ }
  });
})();
</script>

</body>
</html>
