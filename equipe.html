  var SENS_RESULTAT = { V: "gagnée", D: "perdue", N: "nulle" };

  function ajouterPastilles(conteneur, forme) {
    forme.forEach(function (r) {
      conteneur.appendChild(el("span", { class: "forme-res " + r.toLowerCase(), title: "Partie " + SENS_RESULTAT[r], text: r }));
    });
  }

  // Ni le nom ni le numéro du responsable ne sont affichés : seulement les
  // boutons, et WhatsApp s'ouvre sur une conversation vide. Sans numéro
  // exploitable, pas de boutons.
  function buildContacts(adv) {
    var numero = adv.contact ? normalizePhoneForWhatsapp(adv.contact.tel) : null;
    if (!numero) return null;
    var qui = "le responsable de " + clubLabel(etat.clubMap, adv.clubCode, adv.numero);
    var ligne = el("div", { class: "fiche-ligne" });
    ligne.appendChild(el("span", { text: "Responsable" }));
    [["tel", ICON_SVG_TEL, "tel:+" + numero, "Appeler " + qui],
     ["sms", ICON_SVG_SMS, "sms:+" + numero, "Envoyer un SMS à " + qui],
     ["wa", ICON_SVG_WHATSAPP, "https://wa.me/" + numero, "Écrire sur WhatsApp à " + qui]].forEach(function (c) {
      var a = el("a", { class: "contact-btn " + c[0], href: c[2], title: c[3], "aria-label": c[3] });
      if (c[0] === "wa") { a.target = "_blank"; a.rel = "noopener"; }
      a.innerHTML = c[1];
      ligne.appendChild(a);
    });
    return ligne;
  }

  // Fiche de l'adversaire d'une partie à venir : son rang, sa forme, ses
  // joueurs et de quoi joindre son responsable. Un adversaire pas encore
  // désigné (club fictif) n'est pas parmi les équipes choisissables : pas de
  // fiche.
  function buildFicheAdversaire(team, m) {
    var adv = etat.index[teamKey(team.spec, team.cat, m.clubAdv, m.numAdv)];
    if (!adv) return null;
    var fiche = el("div", { class: "fiche-adv" });
    var p = pouleDe(etat.standings, adv), b = bilanDe(adv);

    var ligne = el("div", { class: "fiche-ligne" });
    if (p) ligne.appendChild(el("b", { text: rangEnClair(p) }));
    if (b.forme.length) {
      ligne.appendChild(el("span", { text: (p ? "· " : "") + "Série en cours" }));
      ajouterPastilles(ligne, b.forme);
    }
    if (!p && !b.forme.length) ligne.appendChild(el("span", { text: "aucune partie jouée" }));
    fiche.appendChild(ligne);

    if (!etat.data.compositionsIndisponibles) {
      fiche.appendChild(el("div", {
        class: "fiche-ligne",
        text: adv.roster ? "Joueurs : " + adv.roster.join(", ") : "Composition non déclarée à la ligue"
      }));
    }
    var contacts = buildContacts(adv);
    if (contacts) fiche.appendChild(contacts);
    return fiche;
  }

  // ---------------------------------------------------------------
  // Prochaine partie dans l'agenda : fichier iCalendar (.ics) construit sur
  // l'appareil. Heure de Paris quel que soit le fuseau du téléphone ; ni nom
  // de joueur ni contact de responsable dans le fichier.
  // ---------------------------------------------------------------
  var AGENDA_DUREE_MIN = 90;
  var VTIMEZONE_PARIS = [
    "BEGIN:VTIMEZONE", "TZID:Europe/Paris",
    "BEGIN:DAYLIGHT", "TZOFFSETFROM:+0100", "TZOFFSETTO:+0200", "TZNAME:CEST",
    "DTSTART:19700329T020000", "RRULE:FREQ=YEARLY;BYMONTH=3;BYDAY=-1SU", "END:DAYLIGHT",
    "BEGIN:STANDARD", "TZOFFSETFROM:+0200", "TZOFFSETTO:+0100", "TZNAME:CET",
    "DTSTART:19701025T030000", "RRULE:FREQ=YEARLY;BYMONTH=10;BYDAY=-1SU", "END:STANDARD",
    "END:VTIMEZONE"
  ];

  function pad2(n) { return String(n).padStart(2, "0"); }

  // Heure murale AAAAMMJJTHHMM00, calculée en UTC pour ne pas dépendre du
  // fuseau de l'appareil : seul le report au lendemain compte, pas l'heure d'été.
  function heureMurale(d, hour, minute, plusMinutes) {
    var t = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate(), hour, minute + (plusMinutes || 0)));
    return t.getUTCFullYear() + pad2(t.getUTCMonth() + 1) + pad2(t.getUTCDate()) +
      "T" + pad2(t.getUTCHours()) + pad2(t.getUTCMinutes()) + "00";
  }

  function icsTexte(s) {
    return String(s).replace(/\\/g, "\\\\").replace(/;/g, "\\;").replace(/,/g, "\\,").replace(/\r\n?|\n/g, "\\n");
  }

  // Une ligne iCalendar ne dépasse pas 75 octets : la suite passe à la ligne,
  // précédée d'une espace. On coupe entre deux caractères, jamais dans un accent.
  var ENCODEUR_UTF8 = new TextEncoder();
  function icsPlier(ligne) {
    var morceaux = [], courant = "", octets = 0;
    Array.from(ligne).forEach(function (ch) {
      var n = ch.charCodeAt(0) < 128 ? 1 : ENCODEUR_UTF8.encode(ch).length;
      if (octets + n > 75) {
        morceaux.push(courant);
        courant = " ";
        octets = 1;
      }
      courant += ch;
      octets += n;
    });
    morceaux.push(courant);
    return morceaux.join("\r\n");
  }

  // « Charlie 1 », comme le compteur nomme les équipes, plutôt que
  // « Charlie (éq. 1) » : les deux équipes du titre se lisent pareil.
  function nomEquipe(team) {
    return team.clubNom + (team.numero ? " " + team.numero : "");
  }

  function nomEquipeAdverse(m) {
    var nom = etat.clubMap[m.clubAdv] || ("Club " + m.clubAdv);
    return clubFictif(m.clubAdv) || !m.numAdv ? nom : nom + " " + m.numAdv;
  }

  function serieEtPhase(team, m) {
    return team.serieLabel + (m.meta ? " · " + m.meta : "");
  }

  // Identifiant de la partie dans la ligue ; sans lui, les deux équipes et la
  // phase, jamais la date, pour qu'une partie reportée garde le même.
  function uidPartie(team, m) {
    if (m.oid) return "partie-" + m.oid + "@lidfpb";
    var nous = team.clubCode + "-" + team.numero, eux = m.clubAdv + "-" + m.numAdv;
    return ["partie", team.spec, team.cat, m.chezSoi ? nous : eux, m.chezSoi ? eux : nous, m.meta]
      .join("-").replace(/[^A-Za-z0-9-]/g, "") + "@lidfpb";
  }

  function icsPartie(team, m, maintenant, adressePage) {
    var nous = nomEquipe(team);
    var eux = nomEquipeAdverse(m);
    var titre = (m.chezSoi ? nous : eux) + " – " + (m.chezSoi ? eux : nous) + " · " + team.serieLabel;
    var description = serieEtPhase(team, m) + "\n" + adressePage;
    var horodatage = maintenant.toISOString().replace(/[-:]/g, "").replace(/\.\d+/, "");
    var lignes = ["BEGIN:VCALENDAR", "VERSION:2.0", "PRODID:-//LIDFPB//Trinquet Paris//FR",
      "CALSCALE:GREGORIAN", "METHOD:PUBLISH"].concat(VTIMEZONE_PARIS, [
      "BEGIN:VEVENT",
      "UID:" + uidPartie(team, m),
      "DTSTAMP:" + horodatage,
      // Un nouvel ajout (après un report) doit l'emporter sur le précédent :
      // la révision croît avec le temps, en minutes.
      "SEQUENCE:" + Math.floor(maintenant.getTime() / 60000),
      "LAST-MODIFIED:" + horodatage,
      "DTSTART;TZID=Europe/Paris:" + heureMurale(m.date, m.hour, m.minute),
      "DTEND;TZID=Europe/Paris:" + heureMurale(m.date, m.hour, m.minute, AGENDA_DUREE_MIN),
      "SUMMARY:" + icsTexte(titre)
    ]);
    if (m.lieu) lignes.push("LOCATION:" + icsTexte(m.lieu));
    lignes.push("DESCRIPTION:" + icsTexte(description),
      "BEGIN:VALARM", "ACTION:DISPLAY", "TRIGGER:-P1D", "DESCRIPTION:" + icsTexte(titre), "END:VALARM",
      "END:VEVENT", "END:VCALENDAR");
    return lignes.map(icsPlier).join("\r\n") + "\r\n";
  }

  function telechargerAgenda(team, m) {
    var adresse = window.location.origin + window.location.pathname +
      "?equipe=" + encodeURIComponent(teamKey(team.spec, team.cat, team.clubCode, team.numero));
    var blob = new Blob([icsPartie(team, m, new Date(), adresse)], { type: "text/calendar;charset=utf-8" });
    var url = URL.createObjectURL(blob);
    var lien = el("a", {
      href: url,
      download: "partie-" + m.date.getFullYear() + "-" + pad2(m.date.getMonth() + 1) + "-" + pad2(m.date.getDate()) + ".ics"
    });
    document.body.appendChild(lien);
    lien.click();
    lien.remove();
    // Safari lit le fichier après le clic : l'adresse est libérée plus tard.
    setTimeout(function () { URL.revokeObjectURL(url); }, 60000);
  }

  function buildProchaine(team) {
    var carte = section("Prochaine partie");
    var m = prochainePartie(team, startOfDay(new Date()));
    if (!m) {
      carte.appendChild(el("div", { class: "section-note", text: "plus de partie programmée" }));
      return carte;
    }
    var corps = el("div", { class: "prochaine" });
    corps.appendChild(el("div", { class: "prochaine-quand", text: formatShortDate(m.date) + " · " + formatHour(m.hour, m.minute) }));
    corps.appendChild(contreAdversaire("prochaine-adv", team, m));
    var meta = [m.meta, m.lieu].filter(function (x) { return !!x; }).join(" · ");
    if (meta) corps.appendChild(el("div", { class: "match-meta", text: meta }));
    var boutons = el("div", { class: "prochaine-actions" });
    // Le compteur, avec les deux équipes déjà nommées, recevante d'abord.
    var nous = nomEquipe(team);
    var compteur = el("a", {
      class: "report-btn",
      href: "compteur.html?e1=" + encodeURIComponent(m.chezSoi ? nous : m.adversaire) +
        "&e2=" + encodeURIComponent(m.chezSoi ? m.adversaire : nous) +
        "&cible=40&info=" + encodeURIComponent(serieEtPhase(team, m))
    });
    compteur.innerHTML = ICON_SVG_COMPTEUR;
    compteur.appendChild(el("span", { text: "Compter cette partie" }));
    boutons.appendChild(compteur);
    var agenda = el("button", { type: "button", class: "report-btn" });
    agenda.innerHTML = ICON_SVG_AGENDA;
    agenda.appendChild(el("span", { text: "Ajouter à mon agenda" }));
    agenda.addEventListener("click", function () { telechargerAgenda(team, m); });
    boutons.appendChild(agenda);
    if (canReport(m)) {
      var btn = el("a", { class: "report-btn", href: "report.html?oid=" + encodeURIComponent(m.oid) });
      btn.innerHTML = ICON_SVG_REPLAN;
      btn.appendChild(el("span", { text: "Chercher une date de report" }));
      boutons.appendChild(btn);
    }
    corps.appendChild(boutons);
    var fiche = buildFicheAdversaire(team, m);
    if (fiche) corps.appendChild(fiche);
    carte.appendChild(corps);
    return carte;
  }

  function buildBilan(team, p) {
    var carte = section("Bilan");
    var b = bilanDe(team);
    var ligne = el("div", { class: "bilan" });
    if (team.jouees) {
      ligne.appendChild(el("b", { text: pluriel(team.jouees, "partie") + " jouée" + (team.jouees > 1 ? "s" : "") }));
      var detail = " · " + pluriel(team.gagnees, "gagnée") + ", " + pluriel(team.perdues, "perdue");
      if (team.nulles) detail += ", " + pluriel(team.nulles, "nulle");
      if (team.aVenir) detail += " · " + team.aVenir + " à venir";
      ligne.appendChild(document.createTextNode(detail));
      ligne.appendChild(el("br"));
      ligne.appendChild(document.createTextNode("Points marqués " + b.marques + " · encaissés " + b.encaisses));
    } else {
      ligne.appendChild(el("b", { text: "aucune partie jouée" }));
      if (team.aVenir) ligne.appendChild(document.createTextNode(" · " + team.aVenir + " à venir"));
    }
    carte.appendChild(ligne);

    if (b.forme.length) {
      var forme = el("div", { class: "forme" });
      forme.appendChild(el("span", { class: "forme-label", text: "Série en cours" }));
      ajouterPastilles(forme, b.forme);
      carte.appendChild(forme);
    }

    if (p) {
      var objectif = el("div", { class: "objectif" });
      objectif.appendChild(el("span", { class: "forme-label", text: "Pour sortir des poules" }));
      objectif.appendChild(el("div", { text: messageQualification(objectifQualification(etat.data.rencontres, p)) }));
      carte.appendChild(objectif);
    }
    return carte;
  }

  function buildParties(team) {
    var carte = section("Ses parties", pluriel(team.matches.length, "partie"));
    team.matches.forEach(function (m) {
      carte.appendChild(buildMatchRow(team, m));
      if (m.scoreSoi !== null) return;
      var fiche = buildFicheAdversaire(team, m);
      if (fiche) carte.appendChild(fiche);
    });
    var prevenir = buildPrevenir(team);
    if (prevenir) carte.appendChild(prevenir);
    return carte;
  }

  // ---------------------------------------------------------------
  // Prévenir l'équipe de ce qui lui reste à jouer
  // ---------------------------------------------------------------
  // Les parties sans score, contre un adversaire connu. Celles dont la date
  // est passée sont à reprogrammer : sans résultat publié, la ligue les
  // considère comme non jouées.
  function partiesAJouer(team, today) {
    var restantes = team.matches.filter(function (m) { return m.scoreSoi === null && !clubFictif(m.clubAdv); });
    return {
      enRetard: restantes.filter(function (m) { return m.date && m.date < today; }),
      aVenir: restantes.filter(function (m) { return !m.date || m.date >= today; })
    };
  }

  function lieuCourt(lieu) {
    var m = /\(([^)]+)\)/.exec(lieu || "");
    return m ? m[1].split(" - ")[0].trim() : (lieu || "");
  }

  // Dates des 1/4, 1/2 et finale de la saison, une par phase, données par
  // la ligue : celles de son site s'étalent sur plusieurs jours. Seuls les
  // quarts diffèrent d'une série à l'autre. Une phase passée n'est plus
  // rappelée : à mettre à jour chaque saison.
  var PHASES_FINALES = [
    { label: "1/4 de finale", dates: { "1": new Date(2026, 10, 14), "2": new Date(2026, 10, 22) } },
    { label: "1/2 finale", dates: { "1": new Date(2026, 10, 29), "2": new Date(2026, 10, 29) } },
    { label: "Finale", dates: { "1": new Date(2026, 11, 6), "2": new Date(2026, 11, 6) } }
  ];

  function datesPhasesFinales(team, today) {
    return PHASES_FINALES.filter(function (ph) {
      var d = ph.dates[team.cat];
      return d && d >= today;
    }).map(function (ph) {
      return "• " + ph.label + " : " + formatShortDate(ph.dates[team.cat]);
    });
  }

  // Numéro lisible au téléphone ("06 12 34 56 78"), à partir du format
  // international de normalizePhoneForWhatsapp. Un numéro étranger reste en +.
  function telLisible(raw) {
    var n = normalizePhoneForWhatsapp(raw);
    if (!n) return null;
    if (n.slice(0, 2) === "33" && n.length === 11) return ("0" + n.slice(2)).replace(/(\d\d)(?=\d)/g, "$1 ");
    return "+" + n;
  }

  // Le responsable adverse, pour que l'équipe prévenue l'appelle sans
  // chercher : c'est elle qui doit fixer la date avec lui.
  function ligneResponsableAdverse(team, m) {
    var adv = etat.index[teamKey(team.spec, team.cat, m.clubAdv, m.numAdv)];
    var tel = adv && adv.contact ? telLisible(adv.contact.tel) : null;
    if (!tel) return null;
    return "  Responsable : " + [adv.contact.responsable, tel].filter(Boolean).join(", ");
  }

  // Texte prêt à envoyer, mis en forme pour WhatsApp (*…* en gras) et lisible
  // tel quel en SMS. Les parties en retard d'abord : ce sont elles qui
  // demandent une action.
  function messageAJouer(team, parts) {
    var equipe = clubLabel(etat.clubMap, team.clubCode, team.numero);
    var lignes = ["Bonjour, voici les parties qu'il reste à jouer pour " +
                  [equipe, team.serieLabel, team.poule].filter(Boolean).join(", ") + " :"];
    if (parts.enRetard.length) {
      lignes.push("", "*À reprogrammer au plus vite*");
      parts.enRetard.forEach(function (m) {
        lignes.push("• contre " + m.adversaire + " : prévue le " + formatShortDate(m.date) +
                    ", sans résultat publié. Une date est à trouver au plus vite.");
        var resp = ligneResponsableAdverse(team, m);
        if (resp) lignes.push(resp);
      });
    }
    if (parts.aVenir.length) {
      lignes.push("", "*À venir*");
      parts.aVenir.forEach(function (m) {
        var quand = m.date ? formatShortDate(m.date) + (m.hour !== null ? " " + formatHour(m.hour, m.minute) : "") : "date à fixer";
        lignes.push("• " + quand + " · contre " + m.adversaire + (m.lieu ? " · " + lieuCourt(m.lieu) : ""));
        var resp = ligneResponsableAdverse(team, m);
        if (resp) lignes.push(resp);
      });
    }
    var finales = datesPhasesFinales(team, startOfDay(new Date()));
    if (finales.length) lignes = lignes.concat("", "*Rappel des phases finales*", finales);
    return lignes.join("\n");
  }

  function copier(texte) {
    if (navigator.clipboard && navigator.clipboard.writeText) return navigator.clipboard.writeText(texte);
    return Promise.reject(new Error("presse-papiers indisponible"));
  }

  // WhatsApp directement vers le responsable de l'équipe quand la ligue en
  // a un numéro (ni le nom ni le numéro ne s'affichent), et dans tous les cas
  // la feuille de partage du téléphone, ou la copie sur ordinateur, pour
  // l'envoyer à qui l'on veut.
  function buildPrevenir(team) {
    var parts = partiesAJouer(team, startOfDay(new Date()));
    var n = parts.enRetard.length + parts.aVenir.length;
    if (!n) return null;
    var texte = messageAJouer(team, parts);

    var bloc = el("div", { class: "prevenir" });
    bloc.appendChild(el("div", { class: "prevenir-titre", text: "Prévenir l'équipe" }));
    var note = el("div", { class: "prevenir-note", text: "Un message avec ses " + pluriel(n, "partie") + " à jouer" });
    if (parts.enRetard.length) {
      note.appendChild(document.createTextNode(", dont "));
      note.appendChild(el("b", { text: parts.enRetard.length + " à reprogrammer au plus vite" }));
    }
    note.appendChild(document.createTextNode("."));
    bloc.appendChild(note);

    var btns = el("div", { class: "prevenir-btns" });
    var numero = team.contact ? normalizePhoneForWhatsapp(team.contact.tel) : null;
    if (numero) {
      var wa = el("a", {
        class: "prevenir-btn wa",
        href: "https://wa.me/" + numero + "?text=" + encodeURIComponent(texte),
        target: "_blank",
        rel: "noopener"
      });
      wa.innerHTML = ICON_SVG_WHATSAPP;
      wa.appendChild(el("span", { text: "Au responsable" }));
      btns.appendChild(wa);
    }
    var info = el("span", { class: "prevenir-ok", "aria-live": "polite" });
    var partager = el("button", { type: "button", class: "prevenir-btn" });
    partager.innerHTML = '<svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v12"/><path d="m7 8 5-5 5 5"/><path d="M5 13v6a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-6"/></svg>';
    partager.appendChild(el("span", { text: navigator.share ? "Partager" : "Copier le message" }));
    partager.addEventListener("click", function () {
      info.textContent = "";
      if (navigator.share) {
        navigator.share({ text: texte }).catch(function (e) {
          if (e && e.name === "AbortError") return;   // partage annulé
          copier(texte).then(function () { info.textContent = "Message copié"; });
        });
        return;
      }
      copier(texte).then(function () { info.textContent = "Message copié, à coller"; },
                         function () { info.textContent = "Copie impossible sur ce navigateur"; });
    });
    btns.appendChild(partager);
    btns.appendChild(info);
    bloc.appendChild(btns);
    return bloc;
  }

  function buildReste(reste) {
    var carte = section("Reste à jouer dans la poule", pluriel(reste.length, "partie"));
    reste.forEach(function (r) {
      var row = el("div", { class: "match-row" });
      var quand = el("div", { class: "match-when" });
      if (r.date) {
        quand.appendChild(el("b", { text: formatShortDate(r.date) }));
        quand.appendChild(document.createTextNode(formatHour(r.hour, r.minute)));
      } else {
        quand.appendChild(el("b", { text: "date à venir" }));
      }
      row.appendChild(quand);
      var main = el("div", { class: "match-main" });
      main.appendChild(el("div", { class: "match-opp", text: r.equipes }));
      row.appendChild(main);
      carte.appendChild(row);
    });
    return carte;
  }

  function renderEquipe(cle) {
    var results = document.getElementById("results");
    results.innerHTML = "";
    var team = cle ? etat.index[cle] : null;
    var chips = buildMesChips(cle);
    if (chips) results.appendChild(chips);
    if (!team) {
      results.appendChild(el("div", {
        class: "empty-state",
        text: "Choisissez votre équipe dans la liste ci-dessus, puis touchez « ☆ Suivre » : vous la retrouverez ici et en tête de l'accueil."
      }));
      return;
    }

    var p = pouleDe(etat.standings, team);
    results.appendChild(buildEnTete(team, p));
    results.appendChild(buildBilan(team, p));
    results.appendChild(buildProchaine(team));
    results.appendChild(buildParties(team));
    if (p) {
      var reste = resteAJouer(etat.data.rencontres, etat.clubMap, p, cle);
      if (reste.length) results.appendChild(buildReste(reste));
    }
  }

  // Une pastille par équipe suivie, dans l'ordre où elles ont été suivies.
  // Inutile quand la seule équipe suivie est déjà à l'écran.
  function buildMesChips(cle) {
    var mes = etat.suivies.filter(function (k) { return etat.index[k]; });
    if (!mes.length || (mes.length === 1 && mes[0] === cle)) return null;
    var rang = el("div", { class: "mes-chips", role: "group", "aria-label": "Mes équipes suivies" });
    mes.forEach(function (k) {
      var t = etat.index[k];
      var chip = el("button", {
        type: "button", class: "mes-chip",
        text: clubLabel(etat.clubMap, t.clubCode, t.numero) + " · " + t.serieLabel
      });
      if (k === cle) chip.setAttribute("aria-current", "true");
      chip.addEventListener("click", function () {
        if (k === etat.cle) return;
        montrer(k);
        window.scrollTo({ top: 0 });
      });
      rang.appendChild(chip);
    });
    return rang;
  }

  // Les équipes suivies d'abord, puis toutes les équipes par série, triées par
  // club puis par numéro. Une équipe suivie figure donc deux fois.
  function renderChoix(cle) {
    var select = document.getElementById("choixEquipe");
    select.innerHTML = "";
    select.appendChild(el("option", { value: "", text: "Choisir une équipe…", disabled: "" }));

    var toutes = Object.keys(etat.index).map(function (k) { return { cle: k, t: etat.index[k] }; })
      .sort(function (a, b) {
        return a.t.spec.localeCompare(b.t.spec, "fr", { numeric: true }) ||
               a.t.cat.localeCompare(b.t.cat, "fr", { numeric: true }) ||
               a.t.clubNom.localeCompare(b.t.clubNom, "fr") ||
               a.t.numero.localeCompare(b.t.numero, "fr", { numeric: true });
      });
    function nom(e) { return clubLabel(etat.clubMap, e.t.clubCode, e.t.numero); }

    var mes = toutes.filter(function (e) { return etat.suivies.indexOf(e.cle) !== -1; });
    if (mes.length) {
      var groupeMes = el("optgroup", { label: "Mes équipes" });
      mes.forEach(function (e) {
        groupeMes.appendChild(el("option", { value: e.cle, text: nom(e) + " · " + e.t.serieLabel }));
      });
      select.appendChild(groupeMes);
    }

    var groupe = null, groupeCle = null;
    toutes.forEach(function (e) {
      var k = e.t.spec + "|" + e.t.cat;
      if (k !== groupeCle) {
        groupeCle = k;
        groupe = el("optgroup", { label: e.t.serieLabel });
        select.appendChild(groupe);
      }
      groupe.appendChild(el("option", { value: e.cle, text: nom(e) }));
    });
    select.value = cle;
  }

  // Affiche une équipe à partir des données en mémoire : aucun appel réseau.
  function montrer(cle) {
    etat.cle = cle;
    if (cle) ecrireEquipeVue(cle);
    mettreAJourAdresse(cle);
    document.getElementById("choixEquipe").value = cle;
    renderEquipe(cle);
  }

  var etat = { data: null, clubMap: null, index: null, standings: null, suivies: [], cle: "" };

  // ---------------------------------------------------------------
  // Orchestration
  // ---------------------------------------------------------------
  function formatTime(ts) {
    var d = new Date(ts);
    return d.toLocaleDateString("fr-FR") + " à " + d.toLocaleTimeString("fr-FR", { hour: "2-digit", minute: "2-digit" });
  }

  function formatSync(iso) {
    if (!iso) return null;
    var d = new Date(iso);
    if (Number.isNaN(d.getTime())) return null;
    return formatTime(d.getTime());
  }

  function run(forceRefresh) {
    var lastSyncText = document.getElementById("lastSyncText");
    var bannerSlot = document.getElementById("banner-slot");
    var results = document.getElementById("results");
    bannerSlot.innerHTML = "";
    lastSyncText.textContent = "chargement…";

    function afficher(data) {
      bannerSlot.innerHTML = "";
      lastSyncText.textContent = formatSync(data.lastSync) || "information indisponible";
      etat.data = data;
      etat.clubMap = buildClubMap(data.clubs);
      etat.index = equipesChoisissables(buildTeams(data.rencontres, etat.clubMap, {
        numeroClubMap: buildNumeroClubMap(data.clubs),
        licenceMap: buildLicenceMap(data.licencies),
        engagementsIndex: buildEngagementsIndex(data.engagements)
      }));
      etat.standings = buildStandings(data.rencontres, etat.clubMap);
      etat.suivies = lireMesEquipes();
      // Après un rafraîchissement, l'équipe déjà affichée reste à l'écran.
      var cle = choisirEquipe(etat.index, etat.cle || equipeDansLAdresse(), lireEquipeVue(), etat.suivies);
      renderChoix(cle);
      montrer(cle);
    }

    // 1) Ce que le cache sait déjà est affiché tout de suite, sans attendre le
    //    réseau : l'API met environ deux secondes à répondre, et la source ne
    //    se synchronise qu'une fois par nuit.
    var holder = {};
    var rendu = false;
    var signatureRendue = null;

    fetchLiveData(viaCache(holder)).then(function (data) {
      afficher(data);
      rendu = true;
      signatureRendue = signature(data);
    }).catch(function () {
      // Cache incomplet : il n'y a rien à afficher avant la réponse réseau.
    }).then(function () {
      // 2) Rafraîchissement, sauf si le cache vient tout juste d'être écrit.
      if (rendu && !forceRefresh && (Date.now() - holder.fetchedAt) < CACHE_TTL_MS) return;

      var skeletonTimer = rendu ? null : setTimeout(function () { renderSkeleton(results); }, 150);

      return fetchLiveData(viaReseau(forceRefresh ? 0 : CACHE_TTL_MS)).then(function (data) {
        if (skeletonTimer) clearTimeout(skeletonTimer);
        if (!rendu || signature(data) !== signatureRendue) afficher(data);
        else lastSyncText.textContent = formatSync(data.lastSync) || "information indisponible";
      }).catch(function (err) {
        if (skeletonTimer) clearTimeout(skeletonTimer);
        var message = err && err.message ? err.message : String(err);
        if (rendu) {
          renderBanner(bannerSlot, "warn", "Données non rafraîchies",
            "Le dernier appel à l'API a échoué (" + message + "). " +
            "Les données affichées datent du " + formatTime(holder.fetchedAt) + " et peuvent être obsolètes.");
        } else {
          results.innerHTML = "";
          lastSyncText.textContent = "échec du chargement";
          renderBanner(bannerSlot, "error", "Impossible d'afficher l'équipe",
            message + " — par sécurité, rien n'est affiché : les données seraient potentiellement incomplètes.");
        }
      });
    });
  }

  // ---------------------------------------------------------------
  // Démarrage
  // ---------------------------------------------------------------
  document.getElementById("choixEquipe").addEventListener("change", function (ev) {
    if (!etat.index) return;
    montrer(ev.target.value);
    window.scrollTo({ top: 0 });
  });
  document.getElementById("refreshBtn").addEventListener("click", function () { run(true); });
  document.getElementById("backToTopBtn").addEventListener("click", function () {
    window.scrollTo({ top: 0, behavior: "smooth" });
  });
  run(false);
})();
</script>
