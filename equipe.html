        ? el("div", { class: "match-score retard", text: "à reprogrammer", title: "Date passée sans résultat publié" })
        : el("div", { class: "match-score todo", text: "à venir" }));
    } else {
      var cls = m.scoreSoi > m.scoreAdv ? "win" : (m.scoreSoi < m.scoreAdv ? "loss" : "");
      row.appendChild(el("div", { class: "match-score " + cls, text: m.scoreSoi + " - " + m.scoreAdv }));
    }

    return row;
  }

  // ---------------------------------------------------------------
  // Équipe affichée
  // ---------------------------------------------------------------
  function lireMesEquipes() {
    try {
      var liste = JSON.parse(localStorage.getItem(MES_EQUIPES_KEY));
      return Array.isArray(liste) ? liste.filter(function (k) { return typeof k === "string"; }) : [];
    } catch (e) { return []; /* stockage indisponible ou corrompu : aucune équipe suivie */ }
  }

  function ecrireMesEquipes(liste) {
    try { localStorage.setItem(MES_EQUIPES_KEY, JSON.stringify(liste)); } catch (e) { /* pas bloquant */ }
  }

  // Suivre ou ne plus suivre l'équipe affichée. Une équipe suivie s'ajoute en
  // fin de liste ; les équipes disparues des données sortent de la liste à
  // cette occasion.
  function basculerSuivi(cle) {
    var suivies = etat.suivies.filter(function (k) { return k !== cle && etat.index[k]; });
    if (etat.suivies.indexOf(cle) === -1) suivies.push(cle);
    etat.suivies = suivies;
    ecrireMesEquipes(suivies);
    renderEquipe(etat.cle);
  }

  function equipeDansLAdresse() {
    try { return new URLSearchParams(window.location.search).get("equipe") || ""; } catch (e) { return ""; }
  }

  // L'adresse désigne toujours l'équipe affichée : elle se partage telle quelle.
  // replaceState plutôt que pushState : Retour ramène à la page d'où l'on vient,
  // pas à l'équipe consultée juste avant.
  // Mode organisateur (spec communications-equipes) : ouvert par « orga » dans
  // l'adresse, ou par le lien du pied de page, puis gardé dans le navigateur
  // jusqu'à « Quitter le mode organisateur ». Ce n'est pas une protection : il
  // évite seulement d'encombrer la page des joueurs avec l'outil de
  // l'organisateur.
  var ORGA_KEY = "lidfpb_orga_v1";
  var ORGA_MEMORISE = false;
  var ORGA = (function () {
    var demande = false;
    try { demande = new URLSearchParams(window.location.search).has("orga"); } catch (e) { /* adresse illisible */ }
    try {
      if (demande) localStorage.setItem(ORGA_KEY, "1");
      ORGA_MEMORISE = localStorage.getItem(ORGA_KEY) === "1";
    } catch (e) { ORGA_MEMORISE = false; }
    return demande || ORGA_MEMORISE;
  })();

  function quitterOrga() {
    try { localStorage.removeItem(ORGA_KEY); } catch (e) { /* pas bloquant */ }
    ORGA = false;
    ORGA_MEMORISE = false;
    window.location.replace(adresse(etat.cle));
  }

  // La partie « ?… » de l'adresse : l'équipe affichée, et « orga » quand le
  // navigateur ne peut pas le garder (stockage refusé) : il suit alors
  // l'organisateur d'une vue à l'autre. Mémorisé, il quitte l'adresse : un
  // lien copié pour un joueur ne l'emmène pas en mode organisateur.
  function requete(cle) {
    var params = [];
    if (cle) params.push("equipe=" + encodeURIComponent(cle));
    if (ORGA && !ORGA_MEMORISE) params.push("orga");
    return params.length ? "?" + params.join("&") : "";
  }

  function adresse(cle) { return "equipe.html" + requete(cle); }

  function mettreAJourAdresse(cle) {
    var voulue = window.location.pathname + requete(cle);
    if (voulue === window.location.pathname + window.location.search) return;
    // L'état est gardé : il dit si l'on vient de la liste (voir ouvrirEquipe).
    // Le fragment (« #… », lien d'évitement) reste.
    try { history.replaceState(history.state, "", voulue + window.location.hash); } catch (e) { /* adresse inchangée : pas bloquant */ }
  }

  // Les équipes que l'on peut afficher, par clé : toutes, sauf celles des clubs
  // fictifs (« Equipe à désigner »), qui ne sont pas de vraies équipes.
  function equipesChoisissables(teams) {
    var index = {};
    teams.forEach(function (t) {
      if (!clubFictif(t.clubCode)) index[teamKey(t.spec, t.cat, t.clubCode, t.numero)] = t;
    });
    return index;
  }

  // ---------------------------------------------------------------
  // Calculs propres à la page
  // ---------------------------------------------------------------
  // Même définition que le bloc « Mes équipes » de l'accueil : sans score,
  // datée d'aujourd'hui ou plus tard, avec une heure lisible. Une partie passée
  // restée sans score n'est pas « prochaine » ; elle reste dans la liste des
  // parties, avec son bouton de report.
  function prochainePartie(team, today) {
    return team.matches.filter(function (m) {
      return m.scoreSoi === null && m.date && m.hour !== null && m.date >= today;
    })[0] || null;
  }

  // Bilan sur toutes les parties jouées, toutes phases confondues. La forme suit
  // l'ordre chronologique, la plus récente à droite.
  function bilanDe(team) {
    var jouees = team.matches.filter(function (m) { return m.scoreSoi !== null; });
    var marques = 0, encaisses = 0;
    jouees.forEach(function (m) {
      if (Number.isFinite(m.scoreSoi)) marques += m.scoreSoi;
      if (Number.isFinite(m.scoreAdv)) encaisses += m.scoreAdv;
    });
    return {
      marques: marques,
      encaisses: encaisses,
      forme: jouees.slice(-FORME_NB).map(function (m) {
        return m.scoreSoi > m.scoreAdv ? "V" : (m.scoreSoi < m.scoreAdv ? "D" : "N");
      })
    };
  }

  // La poule de l'équipe se lit dans le classement, où on la retrouve par
  // spécialité, catégorie, club et numéro. Une équipe sans partie de poule n'y
  // figure pas : null, et la page ne lui donne ni rang ni objectif.
  function pouleDe(standings, team) {
    var moi = standings.filter(function (s) {
      return s.spec === team.spec && s.cat === team.cat &&
             s.clubCode === team.clubCode && s.numero === team.numero;
    })[0];
    if (!moi) return null;
    var classees = trierClassement(standings.filter(function (s) {
      return s.spec === moi.spec && s.cat === moi.cat && s.poule === moi.poule;
    }));
    return {
      moi: moi,
      classees: classees,
      rang: moi.jouees ? classees.indexOf(moi) + 1 : null
    };
  }

  function rangEnClair(p) {
    if (!p.rang) return "pas encore classée";
    return (p.rang === 1 ? "1er" : p.rang + "e") + " sur " + p.classees.length + ", poule " + p.moi.poule;
  }

  // ---------------------------------------------------------------
  // Objectif de qualification
  // ---------------------------------------------------------------
  // Au-delà, les 2^N issues prendraient trop de temps sur un téléphone. Une
  // poule de 7 équipes compte 21 parties : seul le tout début de saison est
  // concerné.
  var MAX_PARTIES_ENUMEREES = 20;

  // Toutes les issues (victoire ou défaite) des parties de poule restantes sont
  // passées en revue, avec le critère de la page Classement : points par partie
  // jouée. Le goal average ne se prévoit pas : une égalité de moyenne compte
  // contre l'équipe pour dire « assurée », pour elle pour dire « possible ».
  // Pour chaque nombre k de victoires de l'équipe : sure[k] si toutes les issues
  // la qualifient, possible[k] si au moins une le fait, nette[k] si au moins
  // une le fait sans dépendre d'une égalité.
  function objectifQualification(rencontres, p) {
    var equipes = p.classees;
    var moi = equipes.indexOf(p.moi);
    var indexDe = {};
    equipes.forEach(function (t, i) { indexDe[t.clubCode + "|" + t.numero] = i; });

    var restantes = [];
    rencontres.forEach(function (row) {
      if (!estPhaseDePoules(row) || hasScore(row)) return;
      if (String(row["Spécialité"] || "").trim() !== p.moi.spec ||
          String(row["Catégorie"] || "").trim() !== p.moi.cat ||
          String(row.Poule || "").trim() !== p.moi.poule) return;
      var rec = indexDe[String(row.club_rec || "").trim() + "|" + String(row.equip_rec || "").trim()];
      var vis = indexDe[String(row.club_vis || "").trim() + "|" + String(row.equip_vis || "").trim()];
      if (rec === undefined || vis === undefined) return;   // club fictif : pas une équipe de la poule
      restantes.push({ rec: rec, vis: vis });
    });

    if (!restantes.length) return { statut: "finie", qualifiee: !!p.rang && p.rang <= QUALIFIES_PAR_POULE };
    if (equipes.length <= QUALIFIES_PAR_POULE) return { statut: "assuree" };
    if (restantes.length > MAX_PARTIES_ENUMEREES) return { statut: "trop", restantes: restantes.length };

    var n = restantes.filter(function (m) { return m.rec === moi || m.vis === moi; }).length;
    var sure = [], possible = [], nette = [];
    for (var k = 0; k <= n; k++) { sure.push(true); possible.push(false); nette.push(false); }

    var pts = new Array(equipes.length), jouees = new Array(equipes.length);
    var nbIssues = 1 << restantes.length;   // 20 bits au plus : pas de débordement
    for (var issue = 0; issue < nbIssues; issue++) {
      for (var e = 0; e < equipes.length; e++) { pts[e] = equipes[e].points; jouees[e] = equipes[e].jouees; }
      var victoires = 0;
      for (var i = 0; i < restantes.length; i++) {
        var m = restantes[i];
        var recGagne = ((issue >> i) & 1) === 1;
        pts[m.rec] += recGagne ? PTS_VICTOIRE : PTS_DEFAITE;
        pts[m.vis] += recGagne ? PTS_DEFAITE : PTS_VICTOIRE;
        jouees[m.rec] += 1;
        jouees[m.vis] += 1;
        if ((m.rec === moi && recGagne) || (m.vis === moi && !recGagne)) victoires += 1;
      }
      // Moyennes comparées en produits croisés, en entiers : pas d'arrondi.
      // Une équipe qui n'a rien joué n'a pas de moyenne et ferme la marche.
      var devant = 0, egales = 0;
      for (var u = 0; u < equipes.length; u++) {
        if (u === moi || !jouees[u]) continue;
        var ecart = pts[u] * jouees[moi] - pts[moi] * jouees[u];
        if (ecart > 0) devant += 1;
        else if (ecart === 0) egales += 1;
      }
      if (devant + egales >= QUALIFIES_PAR_POULE) sure[victoires] = false;
      else nette[victoires] = true;
      if (devant < QUALIFIES_PAR_POULE) possible[victoires] = true;
    }
    return { statut: "calcul", n: n, sure: sure, possible: possible, nette: nette };
  }

  function messageQualification(o) {
    if (o.statut === "finie") return o.qualifiee ? "Qualifiée pour les quarts." : "Éliminée.";
    if (o.statut === "assuree") return "Qualifiée quoi qu'il arrive.";
    if (o.statut === "trop") {
      return "Encore " + o.restantes + " parties de poule à jouer : le calcul arrivera après les premières rencontres.";
    }
    if (o.sure[0]) return "Qualifiée quoi qu'il arrive.";
    if (!o.possible[o.n]) {
      return o.n
        ? "Éliminée : même en gagnant " + (o.n > 1 ? "ses " + o.n + " parties restantes" : "sa dernière partie") + ", la 4e place est hors d'atteinte."
        : "Éliminée.";
    }
    var x = o.sure.indexOf(true), z = o.possible.indexOf(true);
    var ga = o.nette[z] ? "" : ", au goal average";
    // Tout gagner sans garantie : une seule phrase plutôt que deux redites.
    if (x < 0 && z === o.n && o.n) {
      return "Il lui faut gagner " + (o.n > 1 ? "ses " + o.n + " parties" : "sa dernière partie") +
             ", et la qualification dépendra encore des autres résultats" + ga + ".";
    }
    var phrases = [];
    if (x >= 0) {
      phrases.push(pluriel(x, "victoire") + " sur " + o.n + (x > 1 ? " assurent" : " assure") + " la qualification.");
    } else if (o.n) {
      phrases.push("Même en gagnant " + (o.n > 1 ? "ses " + o.n + " parties" : "sa dernière partie") + ", la qualification dépendra des autres résultats.");
    }
    if (x < 0 || z < x) {
      var debut = z === 0 ? (o.n ? "Sans victoire" : "Sans plus jouer") : "Dès " + pluriel(z, "victoire");
      phrases.push(debut + ", elle reste possible selon les autres résultats" + ga + ".");
    }
    return phrases.join(" ");
  }

  // Ordre chronologique ; une partie sans date lisible va en fin de liste.
  function parDate(a, b) {
    if (!a.date && !b.date) return 0;
    if (!a.date) return 1;
    if (!b.date) return -1;
    var dd = a.date.getTime() - b.date.getTime();
    if (dd !== 0) return dd;
    return (a.hour || 0) * 60 + a.minute - ((b.hour || 0) * 60 + b.minute);
  }

  // Les parties de la poule qui restent à jouer entre les autres équipes : les
  // siennes sont déjà dans la liste de ses parties.
  function resteAJouer(rencontres, clubMap, p, cle) {
    return rencontres.filter(function (row) {
      if (!estPhaseDePoules(row) || hasScore(row)) return false;
      var spec = String(row["Spécialité"] || "").trim();
      var cat = String(row["Catégorie"] || "").trim();
      if (spec !== p.moi.spec || cat !== p.moi.cat || String(row.Poule || "").trim() !== p.moi.poule) return false;
      return teamKey(spec, cat, row.club_rec, row.equip_rec) !== cle &&
             teamKey(spec, cat, row.club_vis, row.equip_vis) !== cle;
    }).map(function (row) {
      var t = parseHeureRenc(row.heure_renc);
      return {
        date: effectiveDate(row),
        hour: t ? t.hour : null,
        minute: t ? t.minute : 0,
        equipes: clubLabel(clubMap, row.club_rec, row.equip_rec) + " vs " + clubLabel(clubMap, row.club_vis, row.equip_vis)
      };
    }).sort(parDate);
  }

  // ---------------------------------------------------------------
  // Rendu de l'équipe
  // ---------------------------------------------------------------
  function section(titre, sousTitre) {
    var carte = el("div", { class: "section-card" });
    var head = el("div", { class: "section-head" });
    head.appendChild(document.createTextNode(titre + (sousTitre ? " " : "")));
    if (sousTitre) head.appendChild(el("span", { text: sousTitre }));
    carte.appendChild(head);
    return carte;
  }

  function pluriel(n, mot) {
    return n + " " + mot + (n > 1 ? "s" : "");
  }

  function buildEnTete(team, p) {
    var carte = el("div", { class: "section-card" });
    var head = el("div", { class: "team-head" });
    head.appendChild(el("div", { class: "team-name", text: clubLabel(etat.clubMap, team.clubCode, team.numero) }));
    head.appendChild(el("span", { class: "badge serie-" + team.cat, text: team.serieLabel }));
    var cle = teamKey(team.spec, team.cat, team.clubCode, team.numero);
    var suivie = etat.suivies.indexOf(cle) !== -1;
    var suivre = el("button", {
      type: "button", class: "suivre-btn", "aria-pressed": String(suivie),
      text: suivie ? "★ Suivie" : "☆ Suivre",
      title: suivie ? "Ne plus suivre cette équipe" : "Suivre cette équipe"
    });
    suivre.addEventListener("click", function () { basculerSuivi(cle); });
    head.appendChild(suivre);
    carte.appendChild(head);
    if (!suivie) {
      carte.appendChild(el("p", { class: "suivre-aide", text: "Suivie, elle s'affiche en tête de l'accueil, avec sa prochaine partie et son rang, et ressort sur le Classement." }));
    }
    if (p) {
      var rang = el("div", { class: "team-rang" });
      rang.appendChild(el("b", { text: rangEnClair(p) }));
      carte.appendChild(rang);
    }
    // Compositions non chargées : rien plutôt que d'annoncer à tort une
    // composition non déclarée. Noms seuls, jamais de licence ni de contact
    // des joueurs (cf. section RGPD du README) ; le responsable a ses boutons
    // juste dessous.
    if (!etat.data.compositionsIndisponibles) {
      var compo = el("div", { class: "team-roster" + (team.roster ? "" : " absente") });
      compo.appendChild(el("b", { text: team.roster ? "Joueurs : " : "" }));
      compo.appendChild(document.createTextNode(team.roster ? team.roster.join(", ") : "Composition non déclarée à la ligue"));
      carte.appendChild(compo);
    }
    // De quoi joindre le responsable de l'équipe : c'est ici que mènent
    // Parties et le Classement.
    var contacts = buildContacts(team);
    if (contacts) {
      contacts.classList.add("team-contact");
      carte.appendChild(contacts);
    }
    return carte;
  }

  var SENS_RESULTAT = { V: "gagnée", D: "perdue", N: "nulle" };

  function ajouterPastilles(conteneur, forme) {
    forme.forEach(function (r) {
      conteneur.appendChild(el("span", { class: "forme-res " + r.toLowerCase(), title: "Partie " + SENS_RESULTAT[r], text: r }));
    });
  }

  // Ni le nom ni le numéro du responsable ne sont affichés : seulement les
  // boutons, et WhatsApp s'ouvre sur une conversation vide. Sans numéro
  // exploitable, pas de boutons. Sert à l'en-tête de l'équipe (son
  // responsable) et à la fiche de son adversaire.
  function buildContacts(adv) {
    var numero = adv.contact ? normalizePhoneForWhatsapp(adv.contact.tel) : null;
    if (!numero) return null;
    var qui = "responsable de " + clubLabel(etat.clubMap, adv.clubCode, adv.numero);
    var ligne = el("div", { class: "fiche-ligne" });
    ligne.appendChild(el("span", { text: "Responsable" }));
    [["tel", ICON_SVG_TEL, "tel:+" + numero, "Appeler le " + qui],
     ["sms", ICON_SVG_SMS, "sms:+" + numero, "Envoyer un SMS au " + qui],
     ["wa", ICON_SVG_WHATSAPP, "https://wa.me/" + numero, "Écrire sur WhatsApp au " + qui]].forEach(function (c) {
      var a = el("a", { class: "contact-btn " + c[0], href: c[2], title: c[3], "aria-label": c[3] });
      if (c[0] === "wa") { a.target = "_blank"; a.rel = "noopener"; }
      a.innerHTML = c[1];
      ligne.appendChild(a);
    });
    return ligne;
  }

  // Fiche de l'adversaire d'une partie à venir : son rang, sa forme, ses
  // joueurs et de quoi joindre son responsable. Un adversaire pas encore
  // désigné (club fictif) n'est pas parmi les équipes choisissables : pas de
  // fiche.
  function buildFicheAdversaire(team, m) {
    var adv = etat.index[teamKey(team.spec, team.cat, m.clubAdv, m.numAdv)];
    if (!adv) return null;
    var fiche = el("div", { class: "fiche-adv" });
    var p = pouleDe(etat.standings, adv), b = bilanDe(adv);

    var ligne = el("div", { class: "fiche-ligne" });
    if (p) ligne.appendChild(el("b", { text: rangEnClair(p) }));
    if (b.forme.length) {
      ligne.appendChild(el("span", { text: (p ? "· " : "") + "Série en cours" }));
      ajouterPastilles(ligne, b.forme);
    }
    if (!p && !b.forme.length) ligne.appendChild(el("span", { text: "aucune partie jouée" }));
    fiche.appendChild(ligne);

    if (!etat.data.compositionsIndisponibles) {
      fiche.appendChild(el("div", {
        class: "fiche-ligne",
        text: adv.roster ? "Joueurs : " + adv.roster.join(", ") : "Composition non déclarée à la ligue"
      }));
    }
    var contacts = buildContacts(adv);
    if (contacts) fiche.appendChild(contacts);
    return fiche;
  }

  // ---------------------------------------------------------------
  // Prochaine partie dans l'agenda : fichier iCalendar (.ics) construit sur
  // l'appareil. Heure de Paris quel que soit le fuseau du téléphone ; ni nom
  // de joueur ni contact de responsable dans le fichier.
  // ---------------------------------------------------------------
  var AGENDA_DUREE_MIN = 90;
  var VTIMEZONE_PARIS = [
    "BEGIN:VTIMEZONE", "TZID:Europe/Paris",
    "BEGIN:DAYLIGHT", "TZOFFSETFROM:+0100", "TZOFFSETTO:+0200", "TZNAME:CEST",
    "DTSTART:19700329T020000", "RRULE:FREQ=YEARLY;BYMONTH=3;BYDAY=-1SU", "END:DAYLIGHT",
    "BEGIN:STANDARD", "TZOFFSETFROM:+0200", "TZOFFSETTO:+0100", "TZNAME:CET",
    "DTSTART:19701025T030000", "RRULE:FREQ=YEARLY;BYMONTH=10;BYDAY=-1SU", "END:STANDARD",
    "END:VTIMEZONE"
  ];

  function pad2(n) { return String(n).padStart(2, "0"); }

  // Heure murale AAAAMMJJTHHMM00, calculée en UTC pour ne pas dépendre du
  // fuseau de l'appareil : seul le report au lendemain compte, pas l'heure d'été.
  function heureMurale(d, hour, minute, plusMinutes) {
    var t = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate(), hour, minute + (plusMinutes || 0)));
    return t.getUTCFullYear() + pad2(t.getUTCMonth() + 1) + pad2(t.getUTCDate()) +
      "T" + pad2(t.getUTCHours()) + pad2(t.getUTCMinutes()) + "00";
  }

  function icsTexte(s) {
    return String(s).replace(/\\/g, "\\\\").replace(/;/g, "\\;").replace(/,/g, "\\,").replace(/\r\n?|\n/g, "\\n");
  }

  // Une ligne iCalendar ne dépasse pas 75 octets : la suite passe à la ligne,
  // précédée d'une espace. On coupe entre deux caractères, jamais dans un accent.
  var ENCODEUR_UTF8 = new TextEncoder();
  function icsPlier(ligne) {
    var morceaux = [], courant = "", octets = 0;
    Array.from(ligne).forEach(function (ch) {
      var n = ch.charCodeAt(0) < 128 ? 1 : ENCODEUR_UTF8.encode(ch).length;
      if (octets + n > 75) {
        morceaux.push(courant);
        courant = " ";
        octets = 1;
      }
      courant += ch;
      octets += n;
    });
    morceaux.push(courant);
    return morceaux.join("\r\n");
  }

  // « Charlie 1 », comme le compteur nomme les équipes, plutôt que
  // « Charlie (éq. 1) » : les deux équipes du titre se lisent pareil.
  function nomEquipe(team) {
    return team.clubNom + (team.numero ? " " + team.numero : "");
  }

  function nomEquipeAdverse(m) {
    var nom = etat.clubMap[m.clubAdv] || ("Club " + m.clubAdv);
    return clubFictif(m.clubAdv) || !m.numAdv ? nom : nom + " " + m.numAdv;
  }

  function serieEtPhase(team, m) {
    return team.serieLabel + (m.meta ? " · " + m.meta : "");
  }

  // Identifiant de la partie dans la ligue ; sans lui, les deux équipes et la
  // phase, jamais la date, pour qu'une partie reportée garde le même.
  function uidPartie(team, m) {
    if (m.oid) return "partie-" + m.oid + "@lidfpb";
    var nous = team.clubCode + "-" + team.numero, eux = m.clubAdv + "-" + m.numAdv;
    return ["partie", team.spec, team.cat, m.chezSoi ? nous : eux, m.chezSoi ? eux : nous, m.meta]
      .join("-").replace(/[^A-Za-z0-9-]/g, "") + "@lidfpb";
  }

  function icsPartie(team, m, maintenant, adressePage) {
    var nous = nomEquipe(team);
    var eux = nomEquipeAdverse(m);
    var titre = (m.chezSoi ? nous : eux) + " – " + (m.chezSoi ? eux : nous) + " · " + team.serieLabel;
    var description = serieEtPhase(team, m) + "\n" + adressePage;
    var horodatage = maintenant.toISOString().replace(/[-:]/g, "").replace(/\.\d+/, "");
    var lignes = ["BEGIN:VCALENDAR", "VERSION:2.0", "PRODID:-//LIDFPB//Trinquet Paris//FR",
      "CALSCALE:GREGORIAN", "METHOD:PUBLISH"].concat(VTIMEZONE_PARIS, [
      "BEGIN:VEVENT",
      "UID:" + uidPartie(team, m),
      "DTSTAMP:" + horodatage,
      // Un nouvel ajout (après un report) doit l'emporter sur le précédent :
      // la révision croît avec le temps, en minutes.
      "SEQUENCE:" + Math.floor(maintenant.getTime() / 60000),
      "LAST-MODIFIED:" + horodatage,
      "DTSTART;TZID=Europe/Paris:" + heureMurale(m.date, m.hour, m.minute),
      "DTEND;TZID=Europe/Paris:" + heureMurale(m.date, m.hour, m.minute, AGENDA_DUREE_MIN),
      "SUMMARY:" + icsTexte(titre)
    ]);
    if (m.lieu) lignes.push("LOCATION:" + icsTexte(m.lieu));
    lignes.push("DESCRIPTION:" + icsTexte(description),
      "BEGIN:VALARM", "ACTION:DISPLAY", "TRIGGER:-P1D", "DESCRIPTION:" + icsTexte(titre), "END:VALARM",
      "END:VEVENT", "END:VCALENDAR");
    return lignes.map(icsPlier).join("\r\n") + "\r\n";
  }

  function telechargerAgenda(team, m) {
    var adresse = window.location.origin + window.location.pathname +
      "?equipe=" + encodeURIComponent(teamKey(team.spec, team.cat, team.clubCode, team.numero));
    var blob = new Blob([icsPartie(team, m, new Date(), adresse)], { type: "text/calendar;charset=utf-8" });
    var url = URL.createObjectURL(blob);
    var lien = el("a", {
      href: url,
      download: "partie-" + m.date.getFullYear() + "-" + pad2(m.date.getMonth() + 1) + "-" + pad2(m.date.getDate()) + ".ics"
    });
    document.body.appendChild(lien);
    lien.click();
    lien.remove();
    // Safari lit le fichier après le clic : l'adresse est libérée plus tard.
    setTimeout(function () { URL.revokeObjectURL(url); }, 60000);
  }

  function buildProchaine(team) {

  // ---------------------------------------------------------------
  // Prévenir l'équipe de ce qui lui reste à jouer
  // ---------------------------------------------------------------
  // Les parties sans score, contre un adversaire connu. Celles dont la date
  // est passée sont à reprogrammer : sans résultat publié, la ligue les
  // considère comme non jouées.
  function partiesAJouer(team, today) {
    var restantes = team.matches.filter(function (m) { return m.scoreSoi === null && !clubFictif(m.clubAdv); });
    return {
      enRetard: restantes.filter(function (m) { return m.date && m.date < today; }),
      aVenir: restantes.filter(function (m) { return !m.date || m.date >= today; })
    };
  }

  function lieuCourt(lieu) {
    var m = /\(([^)]+)\)/.exec(lieu || "");
    return m ? m[1].split(" - ")[0].trim() : (lieu || "");
  }

  // Dates des 1/4, 1/2 et finale de la saison, une par phase, données par
  // la ligue : celles de son site s'étalent sur plusieurs jours. Seuls les
  // quarts diffèrent d'une série à l'autre. Une phase passée n'est plus
  // rappelée : à mettre à jour chaque saison.
  var PHASES_FINALES = [
    { label: "1/4 de finale", dates: { "1": new Date(2026, 10, 14), "2": new Date(2026, 10, 22) } },
    { label: "1/2 finale", dates: { "1": new Date(2026, 10, 29), "2": new Date(2026, 10, 29) } },
    { label: "Finale", dates: { "1": new Date(2026, 11, 6), "2": new Date(2026, 11, 6) } }
  ];

  function datesPhasesFinales(team, today) {
    return PHASES_FINALES.filter(function (ph) {
      var d = ph.dates[team.cat];
      return d && d >= today;
    }).map(function (ph) {
      return "• " + ph.label + " : " + formatShortDate(ph.dates[team.cat]);
    });
  }

  // Numéro lisible au téléphone ("06 12 34 56 78"), à partir du format
  // international de normalizePhoneForWhatsapp. Un numéro étranger reste en +.
  function telLisible(raw) {
    var n = normalizePhoneForWhatsapp(raw);
    if (!n) return null;
    if (n.slice(0, 2) === "33" && n.length === 11) return ("0" + n.slice(2)).replace(/(\d\d)(?=\d)/g, "$1 ");
    return "+" + n;
  }

  // Le responsable adverse, pour que l'équipe prévenue l'appelle sans
  // chercher : c'est elle qui doit fixer la date avec lui.
  function ligneResponsableAdverse(team, m) {
    var adv = etat.index[teamKey(team.spec, team.cat, m.clubAdv, m.numAdv)];
    var tel = adv && adv.contact ? telLisible(adv.contact.tel) : null;
    if (!tel) return null;
    return "  Responsable : " + [adv.contact.responsable, tel].filter(Boolean).join(", ");
  }

  // Texte prêt à envoyer, mis en forme pour WhatsApp (*…* en gras) et lisible
  // tel quel en SMS. Les parties en retard d'abord : ce sont elles qui
  // demandent une action.
  function messageAJouer(team, parts) {
    var equipe = clubLabel(etat.clubMap, team.clubCode, team.numero);
    var lignes = ["Bonjour, voici les parties qu'il reste à jouer pour " +
                  [equipe, team.serieLabel, team.poule].filter(Boolean).join(", ") + " :"];
    if (parts.enRetard.length) {
      lignes.push("", "*À reprogrammer au plus vite*");
      parts.enRetard.forEach(function (m) {
        lignes.push("• contre " + m.adversaire + " : prévue le " + formatShortDate(m.date) +
                    ", sans résultat publié. Une date est à trouver au plus vite.");
        var resp = ligneResponsableAdverse(team, m);
        if (resp) lignes.push(resp);
      });
    }
    if (parts.aVenir.length) {
      lignes.push("", "*À venir*");
      parts.aVenir.forEach(function (m) {
        var quand = m.date ? formatShortDate(m.date) + (m.hour !== null ? " " + formatHour(m.hour, m.minute) : "") : "date à fixer";
        lignes.push("• " + quand + " · contre " + m.adversaire + (m.lieu ? " · " + lieuCourt(m.lieu) : ""));
        var resp = ligneResponsableAdverse(team, m);
        if (resp) lignes.push(resp);
      });
    }
    var finales = datesPhasesFinales(team, startOfDay(new Date()));
    if (finales.length) lignes = lignes.concat("", "*Rappel des phases finales*", finales);
    return lignes.join("\n");
  }

  function copier(texte) {
    if (navigator.clipboard && navigator.clipboard.writeText) return navigator.clipboard.writeText(texte);
    return Promise.reject(new Error("presse-papiers indisponible"));
  }

  // Le message confié à la feuille de partage du téléphone, ou copié sur
  // ordinateur. Commun à « Prévenir l'équipe » et au message des phases
  // finales.
  function boutonPartager(source) {
    var lire = typeof source === "function" ? source : function () { return source; };
    var info = el("span", { class: "prevenir-ok", "aria-live": "polite" });
    var partager = el("button", { type: "button", class: "prevenir-btn" });
    partager.innerHTML = '<svg viewBox="0 0 256 256" fill="currentColor" width="15" height="15" aria-hidden="true"><path d="M216,112v96a16,16,0,0,1-16,16H56a16,16,0,0,1-16-16V112A16,16,0,0,1,56,96H80a8,8,0,0,1,0,16H56v96H200V112H176a8,8,0,0,1,0-16h24A16,16,0,0,1,216,112ZM93.66,69.66,120,43.31V136a8,8,0,0,0,16,0V43.31l26.34,26.35a8,8,0,0,0,11.32-11.32l-40-40a8,8,0,0,0-11.32,0l-40,40A8,8,0,0,0,93.66,69.66Z"/></svg>';
    partager.appendChild(el("span", { text: navigator.share ? "Partager" : "Copier le message" }));
    partager.addEventListener("click", function () {
      var texte = lire();
      info.textContent = "";
      if (navigator.share) {
        navigator.share({ text: texte }).catch(function (e) {
          if (e && e.name === "AbortError") return;   // partage annulé
          copier(texte).then(function () { info.textContent = "Message copié"; });
        });
        return;
      }
      copier(texte).then(function () { info.textContent = "Message copié, à coller"; },
                         function () { info.textContent = "Copie impossible sur ce navigateur"; });
    });
    return { bouton: partager, info: info };
  }

  // WhatsApp directement vers le responsable de l'équipe quand la ligue en
  // a un numéro (ni le nom ni le numéro ne s'affichent), et dans tous les cas
  // la feuille de partage du téléphone, ou la copie sur ordinateur, pour
  // l'envoyer à qui l'on veut.
  function buildPrevenir(team) {
    var parts = partiesAJouer(team, startOfDay(new Date()));
    var n = parts.enRetard.length + parts.aVenir.length;
    if (!n) return null;
    var texte = messageAJouer(team, parts);

    var bloc = el("div", { class: "prevenir" });
    bloc.appendChild(el("div", { class: "prevenir-titre", text: "Prévenir l'équipe" }));
    var note = el("div", { class: "prevenir-note", text: "Un message avec ses " + pluriel(n, "partie") + " à jouer" });
    if (parts.enRetard.length) {
      note.appendChild(document.createTextNode(", dont "));
      note.appendChild(el("b", { text: parts.enRetard.length + " à reprogrammer au plus vite" }));
    }
    note.appendChild(document.createTextNode("."));
    bloc.appendChild(note);

    var btns = el("div", { class: "prevenir-btns" });
    var numero = team.contact ? normalizePhoneForWhatsapp(team.contact.tel) : null;
    if (numero) {
      var wa = el("a", {
        class: "prevenir-btn wa",
        href: lienWhatsappAvecTexte(numero, texte),
        target: "_blank",
        rel: "noopener"
      });
      wa.innerHTML = ICON_SVG_WHATSAPP;
      wa.appendChild(el("span", { text: "Au responsable" }));
      btns.appendChild(wa);
    }
    var partage = boutonPartager(texte);
    btns.appendChild(partage.bouton);
    btns.appendChild(partage.info);
    bloc.appendChild(btns);
    return bloc;
  }

  function buildReste(reste) {
    var carte = section("Reste à jouer dans la poule", pluriel(reste.length, "partie"));
    reste.forEach(function (r) {

  // Table des noms courts : copie de celle du Classement, de Parties et de

  var CLUBS_ABREGES = {
    "CHAVILLE PELOTE BASQUE": "Chaville",
    "CHATILLON PELOTE BASQUE": "Chatillon",
    "PARIS EUSKAL PILOTA": "PEP",

  // Une équipe sous son nom court : « MPBA 1 ». Seules la liste et le message
  // des phases finales l'emploient ; le reste de la page garde le nom officiel.
  function nomCourt(clubMap, code, equipe) {

    var eq = String(equipe || "").trim();

  // Tracés Phosphor (licence MIT) : chevron, joueurs, et l'avion en papier de
