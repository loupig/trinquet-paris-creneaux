# Contrôles lancés sur chaque PR et à chaque push sur main : le site part en
# production dès la fusion, sans build qui attraperait une erreur avant.
name: Tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  tests:
    # Version figée : ubuntu-latest est passé en 26.04, que Playwright 1.56
    # ne sait pas équiper en Chromium.
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Syntaxe JavaScript des pages
        run: npm run test:syntaxe
      # Pas de téléchargement de navigateur : les tests utilisent le Google
      # Chrome de l'image ubuntu-24.04 (channel « chrome » dans
      # playwright.config.mjs). Le télécharger à chaque exécution a bloqué la
      # CI jusqu'à son délai de 10 minutes.
      - name: Navigateur
        run: google-chrome --version
      - name: Pages sur données fictives
        run: npm run test:pages
      - name: Rapport en cas d'échec
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: rapport-playwright
          path: playwright-report/
          retention-days: 7
