# Revue automatique de chaque PR par Claude, selon REVIEW.md : une première
# lecture avant qu'un humain regarde, pour qu'il garde son attention pour ce
# que seul lui peut juger. Les constats bloquants arrivent en commentaires
# sur les lignes, à résoudre avant la fusion.
#
# Il faut l'un des deux secrets du dépôt : CLAUDE_CODE_OAUTH_TOKEN (abonnement
# Claude, jeton donné par `claude setup-token`) ou ANTHROPIC_API_KEY. Sans
# eux, la revue est sautée sans faire échouer la PR.
name: Revue Claude

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

concurrency:
  group: revue-claude-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  revue:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: write
      issues: read
      id-token: write
    env:
      CLE_CLAUDE: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN != '' || secrets.ANTHROPIC_API_KEY != '' }}
    steps:
      - name: Revue sautée, faute de secret
        if: env.CLE_CLAUDE != 'true'
        run: echo "::notice::Ni CLAUDE_CODE_OAUTH_TOKEN ni ANTHROPIC_API_KEY dans les secrets du dépôt, pas de revue Claude."
      - uses: actions/checkout@v4
        if: env.CLE_CLAUDE == 'true'
        with:
          fetch-depth: 1
      - uses: anthropics/claude-code-action@v1
        if: env.CLE_CLAUDE == 'true'
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            DÉPÔT : ${{ github.repository }}
            PR : ${{ github.event.pull_request.number }}

            Fais la revue de cette PR en suivant REVIEW.md, avec les
            conventions de CLAUDE.md. Lis d'abord la description de la PR :
            le changement résout-il le problème annoncé, sans casser autre
            chose ? Sécurité comprise : donnée de l'API insérée sans
            échappement, donnée personnelle exposée, secret dans le code.

            Avant d'écrire, lis les commentaires déjà postés
            (`gh pr view --comments`) : ne répète aucun constat. S'il y a
            déjà trois résumés de revue, ne cherche plus de nouveaux
            constats mineurs : dis si l'approche mérite d'être reprise
            plutôt que corrigée encore.

            Chaque constat bloquant va en commentaire sur sa ligne
            (mcp__github_inline_comment__create_inline_comment), avec le
            scénario qui casse. Puis un seul commentaire de résumé
            (`gh pr comment`), en français, qui commence par le nombre de
            constats bloquants, dit « rien à corriger » quand c'est le cas,
            et finit par une rubrique « À regarder par un humain » : ce que
            cette revue ne peut pas juger (faut-il le construire, rendu à
            l'écran, exactitude des données de la ligue).
          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"
