    var SOLEIL = '<svg viewBox="0 0 256 256" fill="currentColor" width="19" height="19" aria-hidden="true"><path d="M120,40V16a8,8,0,0,1,16,0V40a8,8,0,0,1-16,0Zm72,88a64,64,0,1,1-64-64A64.07,64.07,0,0,1,192,128Zm-16,0a48,48,0,1,0-48,48A48.05,48.05,0,0,0,176,128ZM58.34,69.66A8,8,0,0,0,69.66,58.34l-16-16A8,8,0,0,0,42.34,53.66Zm0,116.68-16,16a8,8,0,0,0,11.32,11.32l16-16a8,8,0,0,0-11.32-11.32ZM192,72a8,8,0,0,0,5.66-2.34l16-16a8,8,0,0,0-11.32-11.32l-16,16A8,8,0,0,0,192,72Zm5.66,114.34a8,8,0,0,0-11.32,11.32l16,16a8,8,0,0,0,11.32-11.32ZM48,128a8,8,0,0,0-8-8H16a8,8,0,0,0,0,16H40A8,8,0,0,0,48,128Zm80,80a8,8,0,0,0-8,8v24a8,8,0,0,0,16,0V216A8,8,0,0,0,128,208Zm112-88H216a8,8,0,0,0,0,16h24a8,8,0,0,0,0-16Z"/></svg>';
    var racine = document.documentElement;
    var mq = window.matchMedia ? window.matchMedia("(prefers-color-scheme: dark)") : null;
    var metas = document.querySelectorAll('meta[name="theme-color"]');
    var barre = {};
    function themeDe(meta) { return /dark/.test(meta.media) ? "sombre" : "clair"; }
    for (var i = 0; i < metas.length; i++) barre[themeDe(metas[i])] = metas[i].getAttribute("content");
    var choisi = null;
    // Sans stockage, le choix fait sur cette page reste en mémoire.
    function lire() {
      try { var v = localStorage.getItem(CLE); return v === "clair" || v === "sombre" ? v : null; }
      catch (e) { return choisi; }
    }
    choisi = lire();
    function systeme() { return mq && mq.matches ? "sombre" : "clair"; }
    function appliquer() {
      if (choisi) racine.setAttribute("data-theme", choisi === "sombre" ? "dark" : "light");
      else racine.removeAttribute("data-theme");
      // Barre du navigateur : la couleur du thème affiché, quel que soit le téléphone.
      for (var i = 0; i < metas.length; i++) metas[i].setAttribute("content", barre[choisi || themeDe(metas[i])]);
      // Le compteur recalcule ses couleurs d'équipe sur le thème affiché.
      document.dispatchEvent(new Event("lidfpb-theme"));
      var bouton = document.getElementById("themeBtn");
      if (!bouton) return;
      var sombre = (choisi || systeme()) === "sombre";
      bouton.innerHTML = sombre ? SOLEIL : LUNE;
      bouton.setAttribute("aria-label", sombre ? "Passer en thème clair" : "Passer en thème sombre");
      bouton.title = bouton.getAttribute("aria-label");

    document.addEventListener("DOMContentLoaded", function () {
      var bouton = document.getElementById("themeBtn");

        var voulu = (choisi || systeme()) === "sombre" ? "clair" : "sombre";

        try {
          if (choisi) localStorage.setItem(CLE, choisi); else localStorage.removeItem(CLE);
        } catch (e) { /* pas gardé : vaut pour cette page */ }
        appliquer();
      });
      appliquer();
    });
    if (mq && mq.addEventListener) mq.addEventListener("change", appliquer);
    else if (mq && mq.addListener) mq.addListener(appliquer);
    // Choix changé ailleurs : page revenue par le bouton Retour, ou autre onglet.
    function relire() { choisi = lire(); appliquer(); }
    window.addEventListener("pageshow", function (e) { if (e.persisted) relire(); });

  * { box-sizing: border-box; }

  /* États communs : focus visible au clavier, appui marqué, survol sur
     ordinateur. Courbe de Découvrir : 300 ms pour les couleurs, 500 ms pour
     le mouvement. */
  a, button, summary, select, input, textarea, label {
    transition: color 300ms var(--ease), background-color 300ms var(--ease),
      border-color 300ms var(--ease), opacity 300ms var(--ease), transform 500ms var(--ease);
  }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  button:not(:disabled):active { transform: scale(0.98); }
  @media (hover: hover) {
    a:hover, button:not(:disabled):hover, summary:hover { opacity: 0.8; }
  }
  @media (prefers-reduced-motion: reduce) {
    button:not(:disabled):active { transform: none; }
    /* Plus de mouvement : les couleurs changent encore, rien ne bouge. */
    a, button, summary, select, input, textarea, label { transition-property: color, background-color, border-color, opacity; }
    svg { transition: none !important; }
  }

  /* Cibles tactiles d'au moins 44 x 44 px : la zone sensible déborde du
     bouton sans changer son dessin, comme les pastilles du compteur. Pas
     dans les groupes serrés (puces, icônes de contact) : la zone y mordrait
     sur le voisin. */
  .ligue-btn, .pill-btn, .icon-btn, .sim-stats { position: relative; }
  :is(.ligue-btn, .pill-btn, .icon-btn, .sim-stats)::after {
    content: "";
    position: absolute;
    top: min(0px, (100% - 44px) / 2);
    bottom: min(0px, (100% - 44px) / 2);
    left: min(0px, (100% - 44px) / 2);
    right: min(0px, (100% - 44px) / 2);
  }

    -webkit-backdrop-filter: blur(24px) saturate(180%);
    backdrop-filter: blur(24px) saturate(180%);
    box-shadow: 0 4px 16px rgba(var(--ombre-rgb), 0.16);
    color: var(--accent);
    text-decoration: none;
    cursor: pointer;
  }
  .pill-btn:active { opacity: 0.75; }
  .icon-btn {
    display: flex;
    align-items: center;
    width: 36px;
    height: 36px;
    border-radius: 50%;
    padding: 0;
  }
  .icon-btn:active { opacity: 0.75; }
  .icon-btn.calc { color: var(--vert); }
  .icon-btn.calc.on { background: #009B48; border-color: #009B48; color: #fff; }

  /* --- Barre d'onglets flottante, verre dépoli facon iOS --- */
  .tab-bar {
    position: fixed;
    left: 12px;
    right: 12px;
    bottom: calc(10px + env(safe-area-inset-bottom, 0px));
    max-width: 420px;
    margin: 0 auto;
    display: flex;
    gap: 2px;
    padding: 6px;
    border-radius: 24px;
    background: var(--verre);
    -webkit-backdrop-filter: blur(24px) saturate(180%);
    backdrop-filter: blur(24px) saturate(180%);
    border: 1px solid var(--verre-bord);
    box-shadow: 0 6px 24px rgba(var(--ombre-rgb), 0.16);
    z-index: 60;
  }
  .tab-bar a {
    /* Largeur du libellé, puis le reste partagé : « Mes équipes » tient sur
       une ligne dès 360 px. */
    flex: 1 1 auto;
    min-width: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 2px;
    padding: 6px 2px 5px;
    border-radius: 18px;
    color: var(--muted);
    text-decoration: none;
  }
  .tab-bar a span {
    font-size: 12px;
    font-weight: 600;
    letter-spacing: -0.1px;
    white-space: nowrap;
  }
  .tab-bar a.active { color: var(--accent); background: var(--accent-bg); }
  .tab-bar a:active { opacity: 0.7; }
  /* Sous 360 px, la barre rogne ses marges pour que les libellés à 12 px
     tiennent ; rayon des onglets : 24 - 4 = 20 px. */
  @media (max-width: 359px) {
    .tab-bar { left: 6px; right: 6px; padding: 4px; gap: 0; }
    .tab-bar a { padding-left: 0; padding-right: 0; border-radius: 20px; }
  }

  main {
    max-width: 640px;
    margin: 0 auto;
    padding: 14px 12px 92px;
  }

  .banner {
    border-radius: 12px;
    padding: 12px 14px;
    font-size: 14px;
    line-height: 1.4;
    margin-bottom: 14px;
    border: 1px solid;
  }
  .banner.error { background: var(--error-bg); color: var(--error-text); border-color: var(--error-border); }
  .banner.warn { background: var(--warn-bg); color: var(--warn-text); border-color: var(--warn-border); }
  .banner strong { display: block; margin-bottom: 4px; }

  .badge {
    font-size: 12px;
    font-weight: 700;
    padding: 2px 7px;
    border-radius: 9999px;
    border: 1px solid;
  }
  .badge.serie-1 { color: var(--serie1-text); background: var(--serie1-bg); border-color: var(--serie1-border); }
  .badge.serie-2 { color: var(--serie2-text); background: var(--serie2-bg); border-color: var(--serie2-border); }

  /* --- Une poule --- */
  .poule-card {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 12px;
    margin-bottom: 12px;
    overflow: hidden;
  }
  .poule-head {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 10px 14px;
    background: var(--bg);
    border-bottom: 1px solid var(--border);
    font-size: 14px;
    font-weight: 700;
  }
  .poule-head .poule-sub { font-weight: 600; color: var(--muted); font-size: 12px; }

  /* --- Une ligne de classement ---
     Deux lignes par équipe plutôt qu'un tableau à huit colonnes : sur 390px un
     tableau obligerait à défiler horizontalement, ou à des colonnes de 22px
     illisibles. Le critère de tri est à droite, en gros ; le détail qui le
     compose est sur la ligne du dessous. */
  .rank-row {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 8px 14px;
    border-top: 1px solid var(--border);
  }
  .rank-row:first-of-type { border-top: none; }
  .rank-pos {
    flex: 0 0 22px;
    height: 22px;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 50%;
    font-size: 14px;
    font-weight: 700;
    color: var(--muted);
    font-variant-numeric: tabular-nums;
  }
  /* Podium : la couleur porte le rang, pas une icône. Les trois teintes sont
     assombries par rapport à l'or, l'argent et le bronze usuels, qui passent
     mal en petit sur fond blanc. */
  .rank-row.or .rank-pos { color: var(--or-text); background: var(--or-bg); }
  .rank-row.argent .rank-pos { color: var(--argent-text); background: var(--argent-bg); }
  .rank-row.bronze .rank-pos { color: var(--bronze-text); background: var(--bronze-bg); }
  .rank-main { flex: 1 1 auto; min-width: 0; }
  .rank-team { font-size: 14px; font-weight: 700; line-height: 1.3; }
  /* Classement général : pastille et liseré de la poule d'origine. */
  .poule-tag {
    display: inline-block;
    margin-right: 6px;
    padding: 0 6px;
    border-radius: 9999px;
    font-size: 12px;
    font-weight: 700;
    line-height: 18px;
    vertical-align: 1px;
  }
  /* Les mêmes teintes marquent, au tableau des quarts, l'étiquette « 1er P1 ». */
  .teinte-1 { --teinte: var(--poule1-text); --teinte-bg: var(--poule1-bg); }
  .teinte-2 { --teinte: var(--poule2-text); --teinte-bg: var(--poule2-bg); }
  .teinte-3 { --teinte: var(--poule3-text); --teinte-bg: var(--poule3-bg); }
  .teinte-4 { --teinte: var(--poule4-text); --teinte-bg: var(--poule4-bg); }
  .rank-row[class*="teinte-"] { box-shadow: inset 3px 0 0 var(--teinte); }
  .rank-row[class*="teinte-"] .poule-tag { color: var(--teinte); background: var(--teinte-bg); }
  .rank-detail { font-size: 12px; color: var(--muted); line-height: 1.4; margin-top: 1px; }
  /* Joueurs de l'équipe, à la demande : sous le détail, même taille. */
  .rank-joueurs { font-size: 12px; color: var(--muted); line-height: 1.4; margin-top: 2px; }
  .rank-joueurs.inconnus { font-style: italic; }
  .rank-values { flex: 0 0 auto; text-align: right; }
  .rank-score {
    font-size: 16px;
    font-weight: 700;
    line-height: 1.1;
    font-variant-numeric: tabular-nums;
  }
  .rank-score.vide { font-size: 14px; color: var(--muted); }

  /* Trait de qualification : sans libellé, une ligne plus épaisse passerait
     pour une séparation de carte. */
  .cut-line {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 4px 14px 5px;
    border-top: 2px solid var(--accent-border);
  }
  .cut-line span {
    font-size: 12px;
    font-weight: 700;
    color: var(--accent);
  }
  .cut-line i { flex: 1 1 auto; height: 1px; background: var(--accent-border); }

  /* --- Phases finales : prévision des quarts et simulation --- */
  .poule-head .statut {
    margin-left: auto;
    font-size: 12px;
    font-weight: 700;
    padding: 2px 7px;
    border-radius: 9999px;
    color: var(--warn-text);
    background: var(--warn-bg);
  }
  .poule-head .statut.final { color: var(--win-text); background: var(--win-bg); }
  /* Les quarts ne sont pas un classement de plus : en-tête plein et affiche
     face à face, pour qu'on les trouve sans lire les poules. */
  .finales-card { border: 2px solid var(--fort-bord); }
  .finales-card .poule-head { background: var(--fort-bg); color: var(--fort-text); border-bottom: none; }
  .finales-card .poule-head .poule-sub { color: rgba(255, 255, 255, 0.7); }
  /* Tableau final : les quarts à gauche, chacun ses deux équipes l'une sur
     l'autre, et à droite l'arbre qui les mène aux demies puis à la finale.
     L'arbre est dessiné d'après la hauteur réelle des quarts, qu'un nom
     long fait varier. */
  /* position: relative : les quarts y mesurent leur hauteur (offsetTop),
     dans le même repère que l'arbre. */
  .tableau { position: relative; display: grid; grid-template-columns: minmax(0, 1fr) 104px; }
  .tableau-quarts { min-width: 0; }
  .quart-row {
    display: grid;
    grid-template-columns: 22px minmax(0, 1fr);
    align-items: center;
    gap: 2px;
    padding: 4px 4px 4px 8px;
    border-top: 1px solid var(--border);
  }
  .quart-row:first-of-type { border-top: none; }
  .quart-row.moitie { border-top: 2px solid var(--fort-bord); }
  .quart-num { font-size: 12px; font-weight: 700; color: var(--accent); }
  .quart-side {
    display: flex;
    align-items: baseline;
    min-width: 0;
    padding: 2px 6px;
    border-radius: 8px;
    border: 1px solid transparent;
    font-size: 14px;
    font-weight: 700;
    line-height: 1.3;
    overflow-wrap: anywhere;
  }
  .quart-side.suivie { background: var(--accent-bg); border-color: var(--accent-border); color: var(--accent); }
  .quart-side.vide { color: var(--muted); font-weight: 600; }
  .quart-nom { flex: 1; min-width: 0; }
  .quart-proba {
    margin-left: 6px;
    font-size: 12px;
    font-weight: 700;
    color: var(--muted);
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
  }
  .quart-proba.favori { font-weight: 700; color: var(--text); }
  .quart-side.suivie .quart-proba { color: var(--accent); }
  .quart-seed {
    display: inline-block;
    min-width: 36px;
    margin-right: 5px;
    font-size: 12px;
    font-weight: 700;
    text-align: center;
    color: var(--muted);
    background: var(--bg);
    border-radius: 9999px;
    padding: 0 5px;
    vertical-align: 1px;
    white-space: nowrap;
  }
  .quart-seed[class*="teinte-"] { color: var(--teinte); background: var(--teinte-bg); }
  .tableau-arbre { position: relative; border-left: 1px solid var(--border); }
  .tableau-arbre svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
  .tableau-arbre path { fill: none; stroke: var(--muted); stroke-width: 1.5; }
  .tableau-arbre path.mien { stroke: var(--accent); stroke-width: 2.5; }
  .arbre-etape {
    position: absolute;
    transform: translateY(-50%);
    font-size: 12px;
    font-weight: 700;
    line-height: 1;
    padding: 4px 6px;
    border-radius: 9999px;
    background: var(--bg);
    border: 1px solid var(--border);
    color: var(--text);
    white-space: nowrap;
  }
  .arbre-etape.mien { background: var(--accent-bg); border-color: var(--accent-border); color: var(--accent); }
  .arbre-etape.finale { background: var(--fort-bg); border-color: var(--fort-bg); color: var(--fort-text); }
  .finales-note { font-size: 12px; color: var(--muted); line-height: 1.45; padding: 6px 14px 8px; border-top: 1px solid var(--border); margin: 0; }

  .empty-state { text-align: center; color: var(--muted); font-size: 14px; padding: 40px 20px; }

  .skeleton-card {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 12px;
    margin-bottom: 12px;
    overflow: hidden;
  }
  .skeleton-card-header { padding: 12px 14px; border-bottom: 1px solid var(--border); }
  .skeleton-row { padding: 11px 14px; border-bottom: 1px solid var(--border); }
  .skeleton-row:last-child { border-bottom: none; }
  .skeleton-bar {
    height: 12px;
    border-radius: 4px;
    background: linear-gradient(90deg, var(--surface-3) 25%, var(--surface-2) 37%, var(--surface-3) 63%);
    background-size: 400% 100%;
    animation: skeleton-shimmer 1.4s ease-in-out infinite;
  }
  @media (prefers-reduced-motion: reduce) { .skeleton-bar { animation: none; } }
  @keyframes skeleton-shimmer {
    0% { background-position: 100% 50%; }
    100% { background-position: 0 50%; }
  }

  .fab-row {
    position: fixed;
    right: 16px;
    bottom: calc(80px + env(safe-area-inset-bottom, 0px));
    display: flex;
    flex-direction: column;
    gap: 10px;
    z-index: 50;
  }
  .fab-btn {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 44px;
    height: 44px;
    border-radius: 50%;
    border: none;
    background: var(--accent);
    color: var(--sur-accent);
    font-size: 18px;
    line-height: 1;
    box-shadow: 0 2px 10px rgba(var(--ombre-rgb), 0.25);
    cursor: pointer;
  }
  .fab-btn:active { opacity: 0.85; }
  .fab-btn.pill { width: auto; padding: 0 16px; border-radius: 9999px; font-size: 14px; font-weight: 700; color: var(--fort-text); background: var(--fort-bg); }
  .fab-btn[hidden] { display: none; }


  footer { text-align: center; padding: 20px 4px 10px; }
  footer p { margin: 0 0 6px; font-size: 12px; color: var(--muted); }
  footer a { color: var(--muted); }

  /* --- Bilan : retour au Classement --- */
  .retour {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    margin: 0 0 12px;
    font-size: 14px;
    font-weight: 700;
    color: var(--accent);
    text-decoration: none;
  }

  /* --- En-tête du bilan : l'affiche de la fin des poules. Fond plein et
     foncé, comme le tableau des phases finales, liseré aux couleurs de
     l'ikurriña. --- */
  .bilan-hero {
    position: relative;
    overflow: hidden;
    margin-bottom: 14px;
    padding: 18px 16px 16px;
    border-radius: 16px;
    background: var(--fort-bg);
    color: var(--fort-text);
    border: 2px solid var(--fort-bord);
  }
  .bilan-hero::before {
    content: "";
    position: absolute;
    left: 0;
    right: 0;
    top: 0;
    height: 4px;
    background: linear-gradient(90deg, var(--loss-text) 0 50%, var(--vert) 50% 100%);
  }
  .bilan-kicker { margin: 0; font-size: 12px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: var(--sur-fort-doux); }
  .bilan-titre { margin: 4px 0 2px; font-size: 24px; font-weight: 800; line-height: 1.2; }
  .bilan-sous { margin: 0; font-size: 14px; line-height: 1.45; color: var(--sur-fort-doux); }
  .bilan-tuiles {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 8px;
    margin-top: 14px;
  }
  .bilan-tuile {
    padding: 10px 12px;
    border-radius: 12px;
    background: var(--sur-fort-voile);
    border: 1px solid var(--sur-fort-bord);
  }
  .bilan-tuile b { display: block; font-size: 24px; font-weight: 800; line-height: 1.1; font-variant-numeric: tabular-nums; }
  .bilan-tuile span { display: block; margin-top: 2px; font-size: 12px; font-weight: 600; line-height: 1.35; color: var(--sur-fort-doux); }

  /* --- Mes équipes : où en est l'équipe suivie, en une ligne chacune --- */
  .bilan-carte {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 12px;
    margin-bottom: 12px;
    overflow: hidden;
  }
  .bilan-carte-titre {
    margin: 0;
    padding: 10px 14px;
    font-size: 14px;
    font-weight: 700;
    background: var(--bg);
    border-bottom: 1px solid var(--border);
  }
  .mien-ligne { padding: 10px 14px; border-top: 1px solid var(--border); font-size: 14px; line-height: 1.45; }
  .mien-ligne:first-of-type { border-top: none; }
  .mien-ligne b { font-weight: 700; }
  .mien-verdict { display: inline-block; margin-top: 4px; font-size: 12px; font-weight: 700; border-radius: 9999px; padding: 1px 8px; }
  .mien-verdict.ok { color: var(--win-text); background: var(--win-bg); }
  .mien-verdict.ko { color: var(--loss-text); background: var(--error-bg); }
  .mien-verdict.attente { color: var(--muted); background: var(--bg); }
  .mien-detail { display: block; margin-top: 2px; font-size: 14px; color: var(--muted); }

  /* --- Une série --- */
  .serie-titre {
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    gap: 8px;
    margin: 22px 0 10px;
    font-size: 18px;
    font-weight: 800;
  }
  .serie-titre .badge { font-size: 14px; padding: 3px 10px; }
  .serie-titre .statut {
    font-size: 12px;
    font-weight: 700;
    padding: 2px 8px;
    border-radius: 9999px;
    color: var(--warn-text);
    background: var(--warn-bg);
  }
  .serie-titre .statut.final { color: var(--win-text); background: var(--win-bg); }

  /* Trophées : une ligne par distinction, l'emoji en tête, le chiffre qui la
     justifie sous le nom de l'équipe. */
  .trophee {
    display: grid;
    grid-template-columns: 32px minmax(0, 1fr);
    gap: 2px 8px;
    align-items: start;
    padding: 9px 14px;
    border-top: 1px solid var(--border);
  }
  .trophee:first-of-type { border-top: none; }
  .trophee-emoji { font-size: 20px; line-height: 1.2; text-align: center; }
  .trophee-titre { display: block; font-size: 12px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: 0.04em; }
  .trophee-nom { display: block; font-size: 14px; font-weight: 700; line-height: 1.35; overflow-wrap: anywhere; }
  .trophee-valeur { display: block; font-size: 12px; color: var(--muted); line-height: 1.4; }
  .trophee.suivie { background: var(--accent-bg); }
  .trophee.suivie .trophee-nom { color: var(--accent); }

  /* En-tête d'une poule : les étiquettes passent à la ligne entières plutôt
     que de se couper, quand quatre cartes se partagent la largeur. */
  .zone-bilan .poule-head { flex-wrap: wrap; }
  .zone-bilan .poule-head > span { white-space: nowrap; }

  /* Joueurs entre crochets après le nom de l'équipe, comme à l'accueil : en
     retrait, sans gras. */
  .joueurs { font-weight: 400; color: var(--muted); }
  .trophee-serie { font-weight: 600; color: var(--muted); }
  .quart-side.suivie .joueurs, .rank-row.suivie .joueurs { color: inherit; opacity: 0.8; }

  /* Chiffres d'une série : les tuiles de l'affiche, en clair. */
  .bilan-tuiles.clair { margin: 0 0 12px; }
  .bilan-tuiles.clair .bilan-tuile { background: var(--card-bg); border-color: var(--border); color: var(--text); }
  .bilan-tuiles.clair .bilan-tuile span { color: var(--muted); }

  /* Partager le bilan : sous les chiffres de l'affiche. */
  .partage-zone { display: flex; align-items: center; flex-wrap: wrap; gap: 10px; margin-top: 14px; }
  .partage-ok { font-size: 12px; font-weight: 600; color: var(--sur-fort-doux); }
  .partager {
    position: relative;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    min-height: 40px;
    font: inherit;
    font-size: 14px;
    font-weight: 700;
    color: var(--accent);
    background: var(--accent-bg);
    border: 1px solid var(--accent-border);
    border-radius: 9999px;
    padding: 8px 16px;
    cursor: pointer;
  }
  .partager:active { opacity: 0.75; }

  /* Équipe suivie dans le classement d'une poule. */
  .rank-row.suivie { background: var(--accent-bg); }
  .rank-row.suivie .rank-team { color: var(--accent); }

  /* Résultats d'une poule : dépliés à la demande, une partie par ligne, le
     vainqueur en gras, le perdant en retrait. */
  .resultats { border-top: 1px solid var(--border); }
  .resultats summary {
    padding: 10px 14px;
    font-size: 14px;
    font-weight: 700;
    color: var(--accent);
    cursor: pointer;
    list-style-position: inside;
  }
  .resultat {
    display: grid;
    grid-template-columns: 48px minmax(0, 1fr) auto minmax(0, 1fr);
    gap: 6px;
    align-items: center;
    padding: 6px 14px;
    border-top: 1px solid var(--border);
    font-size: 14px;
    line-height: 1.3;
  }
  .resultat-date { font-size: 12px; color: var(--muted); }
  .resultat-eq { min-width: 0; overflow-wrap: anywhere; color: var(--muted); }
  .resultat-eq.rec { text-align: right; }
  .resultat-eq.gagne { color: var(--text); font-weight: 700; }
  .resultat-score { font-weight: 700; white-space: nowrap; font-variant-numeric: tabular-nums; text-align: center; }
  .resultat-score.a-jouer { font-size: 12px; font-weight: 600; color: var(--warn-text); background: var(--warn-bg); border-radius: 9999px; padding: 1px 7px; }
  .resultat.suivie { box-shadow: inset 3px 0 0 var(--accent); }

  .bilan-note { font-size: 12px; color: var(--muted); line-height: 1.45; margin: 4px 2px 0; text-align: center; }

  /* --- Grand écran (spec apparence) ---
     Sous 1000 px, téléphone même à l'horizontale ou tablette en portrait :
     une seule colonne, comme sur un téléphone. Au-delà, la page s'élargit et
     ses blocs se rangent côte à côte. */
  @media (min-width: 1000px) {
    main { max-width: 1400px; padding-left: 24px; padding-right: 24px; }
    /* L'en-tête s'aligne sur le contenu centré (1400 - 2 x 24 px). */
    header { padding-left: max(16px, calc((100% - 1352px) / 2)); padding-right: max(16px, calc((100% - 1352px) / 2)); }
