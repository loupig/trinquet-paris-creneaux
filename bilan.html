  }

  function idClubEquipe(club, equipe) {
    return String(club || "").trim() + "|" + String(equipe || "").trim();
  }

  // Parties réelles des phases finales d'une série (quarts, demies, finale),
  // jamais simulées. Une partie sans score ne compte que poules finies
  // ("poulesFinies") : la ligue inscrit parfois des équipes d'avance, à tort
  // (voir Parties). Le vainqueur se lit aux scores chiffrés ; un forfait
  // garde son score publié, sans vainqueur déduit.
  function partiesFinales(rencontres, spec, cat, poulesFinies) {
    var res = {};
    res[PHASE_QUARTS] = []; res[PHASE_DEMIES] = []; res[PHASE_FINALE] = [];
    rencontres.forEach(function (row) {
      var liste = res[String(row.Phase || "").trim()];
      if (!liste || String(row["Spécialité"] || "").trim() !== spec || String(row["Catégorie"] || "").trim() !== cat) return;
      if (clubFictif(row.club_rec) || clubFictif(row.club_vis)) return;
      var joue = hasScore(row);
      if (!joue && !poulesFinies) return;
      var scores = joue ? [String(row.score_cr).trim(), String(row.score_cv).trim()] : null;
      var vainqueur = null;
      if (scores && /^\d+$/.test(scores[0]) && /^\d+$/.test(scores[1]) && +scores[0] !== +scores[1]) {
        vainqueur = +scores[0] > +scores[1] ? 0 : 1;
      }
      liste.push({ ids: [idClubEquipe(row.club_rec, row.equip_rec), idClubEquipe(row.club_vis, row.equip_vis)], scores: scores, vainqueur: vainqueur });
    });
    return res;
  }

  // Le tableau des quarts, complété des parties réelles des phases finales :
  // équipes que la ligue a placées, scores, vainqueurs portés en demie puis
  // en finale. Chaque duel (quart, demie, finale) a deux côtés et, une fois
  // la partie connue, sa partie orientée comme ses côtés. "restantes" : les
  // parties de poule de la série encore sans score. Recopiée à l'identique
  // dans bilan.html, comme partiesFinales, tableauQuarts, buildDuel et
  // buildArbre : un test compare les deux copies.
  function tableauFinal(rencontres, spec, cat, teams, restantes) {
    var tableau = tableauQuarts(teams);
    if (!tableau.quarts) return tableau;
    var finales = partiesFinales(rencontres, spec, cat, restantes.length === 0);
    var places = tableau.places;
    function idDe(t) { return t ? idClubEquipe(t.clubCode, t.numero) : null; }
    function partieOrientee(p, ordre) {
      return {
        scores: p.scores && [p.scores[ordre[0]], p.scores[ordre[1]]],
        vainqueur: p.vainqueur === null ? null : ordre.indexOf(p.vainqueur)
      };
    }
    function gagnant(duel) {
      return duel.partie && duel.partie.vainqueur !== null ? duel.cotes[duel.partie.vainqueur].team : null;
    }
    function cote(id) { var x = places[id]; return { poule: x.poule, rang: x.rang, team: x.team }; }

    // Les phases finales ont commencé dès qu'un de leurs scores est publié.
    // Avant, une demie ou une finale inscrite sans score est ignorée : la
    // ligue ne peut pas encore en connaître les équipes.
    var commence = [PHASE_QUARTS, PHASE_DEMIES, PHASE_FINALE].some(function (ph) {
      return finales[ph].some(function (p) { return p.scores; });
    });
    if (!commence) { finales[PHASE_DEMIES] = []; finales[PHASE_FINALE] = []; }

    // Quarts : une partie réelle se range au quart où la prévision place
    // l'une de ses équipes. Si la ligue a croisé autrement, l'autre équipe y
    // prend sa place et celle qu'elle remplace prend la sienne, pour que
    // chaque équipe reste une seule fois au tableau.
    var pris = {};
    function placeAuQuart(id) {
      for (var i = 0; i < tableau.quarts.length; i++) {
        for (var k = 0; k < 2; k++) if (idDe(tableau.quarts[i].cotes[k].team) === id) return { q: tableau.quarts[i], k: k };
      }
      return null;
    }
    finales[PHASE_QUARTS].forEach(function (p) {
      var a = placeAuQuart(p.ids[0]), b = placeAuQuart(p.ids[1]);
      var ordre;
      if (a && b && a.q === b.q) {
        if (pris[a.q.num]) return;
        pris[a.q.num] = true;
        a.q.partie = partieOrientee(p, a.k === 0 ? [0, 1] : [1, 0]);
        return;
      }
      var ancre = [a, b].map(function (x, j) { return x && !pris[x.q.num] ? { q: x.q, k: x.k, j: j } : null; })
        .filter(Boolean)[0];
      var idAutre = ancre && p.ids[1 - ancre.j];
      if (!ancre || !places[idAutre]) return;
      var ailleurs = placeAuQuart(idAutre);
      if (ailleurs && pris[ailleurs.q.num]) return;
      var remplacee = ancre.q.cotes[1 - ancre.k];
      ancre.q.cotes[1 - ancre.k] = cote(idAutre);
      if (ailleurs) {
        var idRemplacee = idDe(remplacee.team);
        ailleurs.q.cotes[ailleurs.k] = idRemplacee && places[idRemplacee] ? cote(idRemplacee) : remplacee;
      }
      pris[ancre.q.num] = true;
      ordre = [];
      ordre[ancre.k] = ancre.j; ordre[1 - ancre.k] = 1 - ancre.j;
      ancre.q.partie = partieOrientee(p, ordre);
    });

    // Quart (1 à 4) d'une équipe, pour ranger une demie ou la finale.
    function quartDe(id) { var x = placeAuQuart(id); return x ? x.q.num : null; }

    tableau.demies = DEMIES.map(function (d, i) {
      return {
        num: i + 1,
        cotes: d.map(function (n) {
          return { etiquette: "V.Q" + n, titre: "Vainqueur du quart Q" + n, team: gagnant(tableau.quarts[n - 1]) };
        })
      };
    });
    // Une demie ou la finale réelle nomme ses équipes : elles prennent leur
    // côté, même là où les quarts disaient autre chose, pour que le score
    // publié soit en face de la bonne équipe.
    function placerPartie(duel, p, k0) {
      [0, 1].forEach(function (j) {
        if (places[p.ids[j]]) duel.cotes[j === 0 ? k0 : 1 - k0].team = places[p.ids[j]].team;
      });
      duel.partie = partieOrientee(p, k0 === 0 ? [0, 1] : [1, 0]);
    }
    finales[PHASE_DEMIES].forEach(function (p) {
      var qs = p.ids.map(quartDe);
      var demie = null;
      tableau.demies.forEach(function (dm, i) {
        if (!demie && !dm.partie && qs.some(function (n) { return n !== null && DEMIES[i].indexOf(n) !== -1; })) demie = dm;
      });
      if (!demie) return;
      var d = DEMIES[demie.num - 1];
      // Côté de la demie de la première équipe de la partie.
      placerPartie(demie, p, d.indexOf(qs[0]) !== -1 ? d.indexOf(qs[0]) : 1 - d.indexOf(qs[1]));
    });

    tableau.finale = {
      cotes: tableau.demies.map(function (dm) {
        return { etiquette: "V.D" + dm.num, titre: "Vainqueur de la demie D" + dm.num, team: gagnant(dm) };
      })
    };
    var p = finales[PHASE_FINALE][0];
    if (p) {
      // Moitié haute (Q1, Q2) ou basse (Q3, Q4) de chaque finaliste.
      var moities = p.ids.map(function (id) { var n = quartDe(id); return n === null ? null : (DEMIES[0].indexOf(n) !== -1 ? 0 : 1); });
      var k0 = moities[0] !== null ? moities[0] : (moities[1] !== null ? 1 - moities[1] : -1);
      if (k0 !== -1) placerPartie(tableau.finale, p, k0);
    }
    tableau.champion = gagnant(tableau.finale);
    tableau.commence = commence;
    return tableau;
  }

  // Chances de chaque côté d'un duel, comme au Classement : écart moyen par
  // partie de poule, tiré vers zéro, puis courbe logistique. Le Bilan n'a
  // pas de simulation : la forme d'une équipe est l'équipe elle-même, et
  // "forme" n'est là que pour la signature commune de buildDuel.
  function chancesQuart(q, forme) {
    var a = q.cotes[0].team, b = q.cotes[1].team;
    if (!a || !b || !a.jouees || !b.jouees) return null;
    function force(t) { return t.ga / (t.jouees + PROBA_PARTIES_FICTIVES); }
    var p = 1 / (1 + Math.exp((force(b) - force(a)) / PROBA_ECHELLE));
    var haut = Math.min(95, Math.max(5, Math.round(p * 20) * 5));
    return [haut, 100 - haut];
  }

  // Un côté d'un duel, comme au Classement : son étiquette (rang de poule au
  // quart, « V.Q1 » en demie), l'équipe, puis son score si la partie est
  // jouée, sinon ses chances. Le vainqueur est marqué, le battu grisé.
  function buildSlot(cote, suivies, chances, teinte, score) {
    var t = cote.team;
    var suivie = t && estSuivie(suivies, t);
    var issue = score && score.vainqueur !== null ? (score.gagne ? " gagne" : " battu") : "";
    var side = el("div", { class: "quart-side" + (t ? "" : " vide") + (suivie ? " suivie" : "") + issue });
    var etiquette = cote.etiquette || (ordinal(cote.rang) + " P" + cote.poule);
    var titre = cote.titre || (ordinal(cote.rang) + " de la poule " + cote.poule);
    side.appendChild(el("span", { class: "quart-seed" + (teinte ? " teinte-" + teinte : ""), text: etiquette, title: titre }));
    side.appendChild(el("span", { class: "quart-nom", text: t ? t.label : "À déterminer" }));
    if (score) {
      side.appendChild(el("span", {
        class: "quart-score",
        text: (score.gagne ? "✓ " : "") + score.texte,
        title: score.gagne ? "Vainqueur" : (score.vainqueur !== null ? "Éliminé" : "Score publié")
      }));
    } else if (chances) {
      side.appendChild(el("span", {
        class: "quart-proba" + (chances[0] > chances[1] ? " favori" : ""),
        text: chances[0] + " %",
        title: chances[0] + " % de chances de gagner cette partie, d'après les résultats de poule"
      }));
    }
    return side;
  }

  // Une rangée du tableau : numéro du duel (Q1, D1, F) et ses deux côtés.
  // Rend vrai si des chances y sont affichées.
  function buildDuel(duel, numero, classe, suivies, forme, teintes) {
    var joue = duel.partie && duel.partie.scores;
    var chances = joue ? null : chancesQuart(duel, forme);
    var row = el("div", { class: "quart-row" + (classe ? " " + classe : "") });
    row.appendChild(el("span", { class: "quart-num", text: numero }));
    var duo = el("div", {});
    duel.cotes.forEach(function (c, i) {
      var score = joue ? {
        texte: duel.partie.scores[i],
        vainqueur: duel.partie.vainqueur,
        gagne: duel.partie.vainqueur === i
      } : null;
      var teinte = c.poule ? teintes[c.poule] : (c.team ? teintes[c.team.poule] : null);
      duo.appendChild(buildSlot(c, suivies, chances && [chances[i], chances[1 - i]], teinte, score));
    });
    row.appendChild(duo);
    return { row: row, chances: !!chances };
  }

  // Le tableau final, tel que le Classement le montre sans simulation : la
  // prévision des quarts, puis, une fois les phases finales commencées, leurs
  // scores réels, les demies, la finale et le champion. Le Bilan y ajoute le
  // quart le plus indécis.
  function buildFinalesCard(serie, suivies) {
    var tableau = serie.tableau;
    var commence = !!tableau.commence;
    var carte = el("div", { class: "poule-card finales-card" });
    var head = el("div", { class: "poule-head" });
    head.appendChild(el("span", { class: "badge serie-" + serie.cat, text: serie.label }));
    head.appendChild(el("span", { text: "Tableau final" }));
    head.appendChild(el("span", { class: "poule-sub", text: commence ? "Phases finales" : "1/4 de finale" }));
    var statut, fini;
    if (tableau.champion) { statut = "Terminées"; fini = true; }
    else if (commence) { statut = "En cours"; fini = false; }
    else { statut = serie.restantes.length ? "Prévision" : "Poules terminées"; fini = !serie.restantes.length; }
    head.appendChild(el("span", { class: "statut" + (fini ? " final" : ""), text: statut }));
    carte.appendChild(head);

    var notes = [];
    if (!tableau.quarts) {
      notes.push("Les quarts croisent les deux poules d'une série ; celle-ci en compte " + tableau.nbPoules + ", le tableau n'est pas prévu.");
    } else {
      var teintes = teintesPoules(serie.teams);
      var grille = el("div", { class: "tableau" });
      var colonne = el("div", { class: "tableau-quarts" });
      var rangees = [];
      var mienQ = null;
      var indecis = null;
      var avecChances = false;
      tableau.quarts.forEach(function (q) {
        var duel = buildDuel(q, "Q" + q.num, q.num === DEMIES[1][0] ? "moitie" : "", suivies, null, teintes);
        if (duel.chances) {
          avecChances = true;
          var chances = chancesQuart(q);
          if (!indecis || Math.abs(chances[0] - 50) < Math.abs(indecis.chances[0] - 50)) indecis = { q: q, chances: chances };
        }
        // Le chemin d'une équipe suivie s'arrête quand elle perd son quart.
        q.cotes.forEach(function (c, i) {
          var battue = q.partie && q.partie.scores && q.partie.vainqueur !== null && q.partie.vainqueur !== i;
          if (mienQ === null && !battue && c.team && estSuivie(suivies, c.team)) mienQ = q.num;
        });
        colonne.appendChild(duel.row);
        rangees.push(duel.row);
      });
      grille.appendChild(colonne);
      // Ni quand elle perd sa demie : le trait vers la finale n'est plus le sien.
      var battueEnDemie = false;
      if (mienQ !== null) {
        var dm = tableau.demies[DEMIES[0].indexOf(mienQ) !== -1 ? 0 : 1];
        var battu = dm.partie && dm.partie.vainqueur !== null && dm.cotes[1 - dm.partie.vainqueur].team;
        battueEnDemie = !!(battu && estSuivie(suivies, battu));
      }
      grille.appendChild(buildArbre(colonne, rangees, mienQ, battueEnDemie));
      carte.appendChild(grille);
      if (commence) {
        var suite = el("div", { class: "tableau-suite" });
        suite.appendChild(el("div", { class: "tableau-titre", text: "1/2 finales" }));
        tableau.demies.forEach(function (d) {
          var duel = buildDuel(d, "D" + d.num, "", suivies, null, teintes);
          if (duel.chances) avecChances = true;
          suite.appendChild(duel.row);
        });
        suite.appendChild(el("div", { class: "tableau-titre", text: "Finale" }));
        var duelF = buildDuel(tableau.finale, "F", "", suivies, null, teintes);
        if (duelF.chances) avecChances = true;
        suite.appendChild(duelF.row);
        if (tableau.champion) {
          suite.appendChild(el("p", { class: "tableau-champion", text: "🏆 Champion de " + serie.label + " : " + tableau.champion.label }));
        }
        carte.appendChild(suite);
      }
      if (indecis) {
        notes.push("🔮 Le quart le plus indécis : Q" + indecis.q.num + ", " + indecis.q.cotes[0].team.label + " contre " +
                   indecis.q.cotes[1].team.label + " (" + indecis.chances[0] + " % – " + indecis.chances[1] + " %).");
      }
      notes.push(commence
        ? "Scores des phases finales d'après le site de la ligue, qui fait foi."
        : (serie.restantes.length
          ? "Selon le classement actuel, " + pluriel(serie.restantes.length, "partie") + " de poule à jouer : le tableau peut encore changer."
          : "D'après le classement final des poules. Le tableau officiel reste celui de la ligue."));
      if (avecChances) notes.push("Les % : chances de gagner la partie, d'après l'écart moyen par partie en poule.");
    }
    notes.forEach(function (n) { carte.appendChild(el("p", { class: "finales-note", text: n })); });
    return carte;
  }

  // Arbre des demies et de la finale, recopié du Classement : tracé d'après
  // le milieu réel de chaque quart, retracé quand la carte change de taille.
  var SVG_NS = "http://www.w3.org/2000/svg";

  function buildArbre(colonne, rangees, mienQ, battueEnDemie) {
    var arbre = el("div", { class: "tableau-arbre", "aria-hidden": "true" });
    var svg = document.createElementNS(SVG_NS, "svg");
    arbre.appendChild(svg);
    var etapes = DEMIES.map(function (d, i) {
      var mien = mienQ !== null && d.indexOf(mienQ) !== -1;
      var e = el("span", { class: "arbre-etape" + (mien ? " mien" : ""), text: "D" + (i + 1) });
      arbre.appendChild(e);
      return { quarts: d, el: e, mien: mien };
    });
    var finale = el("span", { class: "arbre-etape finale", text: "Finale" });
    arbre.appendChild(finale);

    function trait(d, mien) {
      var p = document.createElementNS(SVG_NS, "path");
      p.setAttribute("d", d);
      if (mien) p.setAttribute("class", "mien");
      svg.appendChild(p);
    }

    function dessiner() {
      if (!arbre.isConnected) return;
      svg.innerHTML = "";
      var X_DEMIE = 10, X_FINALE = 50;
      var milieux = rangees.map(function (r) { return r.offsetTop + r.offsetHeight / 2; });
      var yDemies = etapes.map(function (e) {
        var y1 = milieux[e.quarts[0] - 1], y2 = milieux[e.quarts[1] - 1];
        var y = (y1 + y2) / 2;
        e.quarts.forEach(function (n, k) {
          trait("M0 " + (k ? y2 : y1) + "H" + X_DEMIE + "V" + y, e.mien && n === mienQ);
        });
        e.el.style.left = (X_DEMIE + 2) + "px";
        e.el.style.top = y + "px";
        return y;
      });
      var yFinale = (yDemies[0] + yDemies[1]) / 2;
      etapes.forEach(function (e, i) {
        trait("M" + (X_DEMIE + 2 + e.el.offsetWidth) + " " + yDemies[i] + "H" + X_FINALE + "V" + yFinale, e.mien && !battueEnDemie);
      });
      finale.style.left = (X_FINALE + 2) + "px";
      finale.style.top = yFinale + "px";
    }

    if (window.ResizeObserver) {
      var obs = new ResizeObserver(function () {
        if (!arbre.isConnected) { obs.disconnect(); return; }
        dessiner();
      });
      obs.observe(colonne);
    } else {
      requestAnimationFrame(dessiner);
    }
    return arbre;
  }

  // ---------------------------------------------------------------
  // Partage : une image PNG et un court texte, pour un groupe WhatsApp
  // (spec bilan). Ni l'un ni l'autre ne porte de nom de joueur.
  // ---------------------------------------------------------------
  var dernierPartage = null;
  var IMG_LARGEUR = 1080, IMG_MARGE = 56;

  function couleursPage() {
    var st = getComputedStyle(document.documentElement), c = {};
    ["bg", "card-bg", "text", "muted", "border", "accent", "accent-bg", "accent-border",
     "serie1-text", "serie1-bg", "serie1-border", "serie2-text", "serie2-bg", "serie2-border",
     "fort-bg", "fort-text", "sur-fort-doux", "sur-fort-voile", "sur-fort-bord", "loss-text", "vert",
     "win-text", "win-bg", "warn-text", "warn-bg",
     "poule1-text", "poule1-bg", "poule2-text", "poule2-bg", "poule3-text", "poule3-bg", "poule4-text", "poule4-bg"].forEach(function (k) {
      c[k] = st.getPropertyValue("--" + k).trim();
    });
    return c;
  }

  function police(taille, graisse) { return graisse + " " + taille + "px Manrope, sans-serif"; }

  function arrondi(g, x, y, w, h, r) {
    g.beginPath();
    if (g.roundRect) g.roundRect(x, y, w, h, r); else g.rect(x, y, w, h);
  }

  function tronquer(g, texte, max) {
    if (g.measureText(texte).width <= max) return texte;
    while (texte.length > 1 && g.measureText(texte + "…").width > max) texte = texte.slice(0, -1);
    return texte + "…";
  }

  // Une pastille, comme les badges de la page ; rend sa largeur.
  function pastille(g, x, yMilieu, texte, taille, fond, encre, bord, aDroite) {
    g.font = police(taille, 700);
    var w = g.measureText(texte).width + taille * 1.2, h = taille * 1.65;
    var gauche = aDroite ? x - w : x;
    arrondi(g, gauche, yMilieu - h / 2, w, h, h / 2);
    g.fillStyle = fond; g.fill();
    if (bord) { g.lineWidth = 2; g.strokeStyle = bord; g.stroke(); }
    g.fillStyle = encre; g.textBaseline = "middle";
    g.fillText(texte, gauche + taille * 0.6, yMilieu + 1);
    return w;
  }

  function lienBilan() { return location.origin + location.pathname; }

  // Le nom d'une série au partage : la spécialité en plus quand il y en a
  // plusieurs, sans quoi deux « Série 1 » se confondraient.
  function nomSerie(ctx, serie) {
    return (ctx.plusieursSpecs ? (SPEC_LABELS[serie.spec] || ("Spécialité " + serie.spec)) + " · " : "") + serie.label;
  }

  // Ce que l'image et le texte retiennent : l'état des poules, les chiffres,
  // quelques trophées toutes séries et le tableau des quarts de chaque série.
  function preparerPartage(ctx, lastSync) {
    var etat = ctx.etat;
    var statut = etat.fini
      ? "Poules terminées · " + pluriel(ctx.qualifies, "équipe qualifiée", "équipes qualifiées")
      : "Bilan provisoire · " + (etat.aVenir ? pluriel(etat.aVenir, "partie") + " à jouer" : "toutes les parties jouées") +
        (etat.attendus ? (etat.aVenir ? ", " : " · ") + pluriel(etat.attendus, "score") + " attendu" + (etat.attendus > 1 ? "s" : "") : "");
    var tous = trierClassement(ctx.teams);
    var leader = tous[0] && tous[0].jouees ? tous[0] : null;
    var decisives = ctx.parties.jouees.slice().sort(ordreChrono).filter(function (p) { return p.ecart > 0; });
    var large = decisives.length ? decisives.reduce(function (m, p) { return p.ecart > m.ecart ? p : m; }) : null;
    var serree = decisives.length ? decisives.reduce(function (m, p) { return p.ecart < m.ecart ? p : m; }) : null;
    var lignesTrophees = [];
    if (leader) lignesTrophees.push(["🏆", "Meilleur bilan", leader.label + " · " + leader.serieLabel, fmtMoyenne(leader.moyenne) + " pts par partie"]);
    if (large) lignesTrophees.push(["💥", "Plus large victoire", fmtPartie(large), serieDe(large) + " · " + pluriel(large.ecart, "point") + " d'écart"]);
    if (serree) lignesTrophees.push(["😰", "Partie la plus serrée", fmtPartie(serree), serieDe(serree) + " · " + pluriel(serree.ecart, "point") + " d'écart"]);

    var g = ctx.global;
    var texte = ["*🏁 Bilan de la phase de poules · Pala gomme pleine, Île-de-France*", statut,
      pluriel(g.jouees, "partie jouée", "parties jouées") + ", " + fmtEntier(g.points) + " points marqués" +
      (g.pctSerrees !== null ? ", " + g.pctSerrees + " % de parties serrées" : "") + "."];
    lignesTrophees.forEach(function (l) { texte.push(l[0] + " " + l[1] + " : " + l[2]); });
    ctx.liste.forEach(function (serie) {
      texte.push("");
      if (!serie.tableau.quarts) {
        texte.push("*" + nomSerie(ctx, serie) + "*");
        texte.push("Pas de tableau des quarts pour cette série.");
        return;
      }
      texte.push("*" + nomSerie(ctx, serie) + " · 1/4 de finale" + (serie.restantes.length && !serie.tableau.commence ? " (prévision)" : "") + "*");
      serie.tableau.quarts.forEach(function (q) {
        // Un quart joué porte son score, le vainqueur coché, comme à l'écran.
        var sc = q.partie && q.partie.scores;
        texte.push("Q" + q.num + " " + q.cotes.map(function (c, k) {
          return ordinal(c.rang) + " P" + c.poule + " " + (c.team ? c.team.label : "à déterminer") +
                 (sc ? " " + (q.partie.vainqueur === k ? "✓ " : "") + sc[k] : "");
        }).join(" – "));
      });
      if (serie.tableau.champion) texte.push("🏆 Champion : " + serie.tableau.champion.label);
    });
    texte.push("");
    texte.push("Tout le bilan : " + lienBilan());

    var partage = { nom: "lidfpb-bilan-des-poules.png", texte: texte.join("\n"), ctx: ctx, statut: statut, trophees: lignesTrophees, lastSync: lastSync };
    dessinerPlusTard(partage);
    return partage;
  }

  // L'image est prête avant le toucher : la feuille de partage du téléphone
  // doit s'ouvrir dans le geste même. Pas encore prête : le texte part seul.
  // Dessinée un peu après l'affichage pour ne pas le retarder, une seule fois
  // par jeu de données, et de nouveau quand le thème change : elle prend les
  // couleurs du thème à l'écran.
  var minuterieImage = null;
  function dessinerPlusTard(partage) {
    clearTimeout(minuterieImage);
    minuterieImage = setTimeout(function () {
      var pret = document.fonts && document.fonts.load ? document.fonts.load(police(60, 800)) : Promise.resolve();
      pret.catch(function () {}).then(function () {
        if (dernierPartage !== partage) return;
        var toile = dessinerBilan(partage);
        if (toile.toBlob) toile.toBlob(function (blob) {
          if (blob && dernierPartage === partage) partage.fichier = new File([blob], partage.nom, { type: "image/png" });
        }, "image/png");
      });
    }, 300);
  }

  document.addEventListener("lidfpb-theme", function () {
    if (dernierPartage) dessinerPlusTard(dernierPartage);
  });

  // L'image : 1080 px de large, dessinée dans le navigateur aux couleurs de la
  // page, sur une toile haute recoupée à la hauteur utile.
  function dessinerBilan(partage) {
    var c = couleursPage(), ctx = partage.ctx;
    var W = IMG_LARGEUR, M = IMG_MARGE;
    var brouillon = document.createElement("canvas");
    brouillon.width = W;
    brouillon.height = 5000;
    var g = brouillon.getContext("2d");
    g.fillStyle = c["card-bg"]; g.fillRect(0, 0, W, brouillon.height);

    // En-tête foncé, liseré aux couleurs de l'ikurriña, et les chiffres.
    var HAUT = 430;
    g.fillStyle = c["fort-bg"]; g.fillRect(0, 0, W, HAUT);
    g.fillStyle = c["loss-text"]; g.fillRect(0, 0, W / 2, 10);
    g.fillStyle = c.vert; g.fillRect(W / 2, 0, W / 2, 10);
    g.textBaseline = "alphabetic";
    g.fillStyle = c["sur-fort-doux"]; g.font = police(28, 700);
    g.fillText("Pala gomme pleine · Championnats d'Île-de-France", M, 74);
    g.fillStyle = c["fort-text"]; g.font = police(60, 800);
    g.fillText("Bilan de la phase de poules", M, 146);
    g.fillStyle = c["sur-fort-doux"]; g.font = police(30, 600);
    g.fillText(tronquer(g, partage.statut, W - 2 * M), M, 196);
    var gl = ctx.global;
    var tuiles = [
      [fmtEntier(gl.jouees), "parties jouées"], [fmtEntier(gl.points), "points marqués"],
      [fmt1(gl.ecart), "d'écart moyen"], [gl.pctSerrees !== null ? gl.pctSerrees + " %" : "–", "parties serrées"]
    ];
    var wT = (W - 2 * M - 3 * 16) / 4;
    tuiles.forEach(function (t, i) {
      var x = M + i * (wT + 16);
      arrondi(g, x, 236, wT, 150, 20);
      g.fillStyle = c["sur-fort-voile"]; g.fill();
      g.lineWidth = 2; g.strokeStyle = c["sur-fort-bord"]; g.stroke();
      g.textBaseline = "alphabetic";
      g.fillStyle = c["fort-text"]; g.font = police(50, 800);
      g.fillText(tronquer(g, t[0], wT - 40), x + 20, 312);
      g.fillStyle = c["sur-fort-doux"]; g.font = police(24, 600);
      g.fillText(tronquer(g, t[1], wT - 40), x + 20, 356);
    });

    var y = HAUT + 24;
    function trait() { g.fillStyle = c.border; g.fillRect(M, y, W - 2 * M, 2); }

    // Trophées toutes séries.
    if (partage.trophees.length) {
      g.textBaseline = "alphabetic";
      g.fillStyle = c.text; g.font = police(36, 800);
      g.fillText("Les trophées", M, y + 48);
      y += 72;
      partage.trophees.forEach(function (l) {
        g.textBaseline = "middle";
        g.font = police(40, 400); g.fillStyle = c.text;
        g.fillText(l[0], M, y + 46);
        g.textBaseline = "alphabetic";
        g.fillStyle = c.muted; g.font = police(24, 700);
        g.fillText(l[1].toUpperCase(), M + 70, y + 30);
        g.fillStyle = c.text; g.font = police(32, 700);
        g.fillText(tronquer(g, l[2], W - 2 * M - 70), M + 70, y + 70);
        g.fillStyle = c.muted; g.font = police(26, 600);
        g.fillText(tronquer(g, l[3], W - 2 * M - 70), M + 70, y + 106);
        y += 126;
      });
    }

    // Tableau des quarts de chaque série.
    ctx.liste.forEach(function (serie) {
      y += 12;
      trait();
      y += 22;
      var cat = serie.cat === "2" ? "serie2" : "serie1";
      var milieu = y + 36;
      var wS = pastille(g, M, milieu, nomSerie(ctx, serie), 28, c[cat + "-bg"], c[cat + "-text"], c[cat + "-border"]);
      g.textBaseline = "middle"; g.fillStyle = c.text; g.font = police(36, 800);
      g.fillText(serie.tableau.quarts ? "1/4 de finale" : "Pas de tableau des quarts", M + wS + 18, milieu + 2);
      var fini = !serie.restantes.length;
      pastille(g, W - M, milieu, fini ? "Poules terminées" : "Prévision", 24,
               fini ? c["win-bg"] : c["warn-bg"], fini ? c["win-text"] : c["warn-text"], null, true);
      y += 88;
      if (!serie.tableau.quarts) return;
      var teintes = teintesPoules(serie.teams);
      serie.tableau.quarts.forEach(function (q, i) {
        if (i === 2) { g.fillStyle = c.text; g.fillRect(M, y - 6, W - 2 * M, 3); }
        g.textBaseline = "middle"; g.fillStyle = c.accent; g.font = police(30, 800);
        g.fillText("Q" + q.num, M, y + 52);
        q.cotes.forEach(function (cote, k) {
          var ym = y + 26 + k * 52;
          var tn = "poule" + (teintes[cote.poule] || 1);
          pastille(g, M + 74, ym, ordinal(cote.rang) + " P" + cote.poule, 24, c[tn + "-bg"], c[tn + "-text"], null);
          // Les noms alignés, quelle que soit la largeur de l'étiquette.
          var xNom = M + 74 + 116;
          g.textBaseline = "middle";
          // Un quart joué : le score à droite, le vainqueur coché.
          var sc = q.partie && q.partie.scores;
          var largeurScore = 0;
          if (sc) {
            var gagne = q.partie.vainqueur === k;
            g.font = police(32, 800);
            g.fillStyle = gagne ? c.accent : c.muted;
            g.textAlign = "right";
            g.fillText((gagne ? "✓ " : "") + sc[k], W - M, ym + 1);
            g.textAlign = "left";
            largeurScore = 110;
          }
          g.fillStyle = cote.team ? c.text : c.muted; g.font = police(32, cote.team ? 700 : 600);
          g.fillText(tronquer(g, cote.team ? cote.team.label : "À déterminer", W - M - xNom - largeurScore), xNom, ym + 1);
        });
        y += 116;
        if (i % 2 === 0) { g.fillStyle = c.border; g.fillRect(M + 74, y - 8, W - 2 * M - 74, 2); }
      });
    });

    // Pied : d'où viennent les chiffres, où lire la suite.
    y += 8;
    trait();
    y += 18;
    g.textBaseline = "alphabetic"; g.fillStyle = c.muted; g.font = police(26, 600);
    g.fillText(tronquer(g, "Tout le bilan : " + lienBilan().replace(/^https?:\/\//, ""), W - 2 * M), M, y + 32);
    var sync = formatSync(partage.lastSync);
    g.fillText(tronquer(g, "Scores du site de la ligue" + (sync ? ", synchro du " + sync : "") + ".", W - 2 * M), M, y + 72);
    g.fillText("Le tableau officiel reste celui de la ligue.", M, y + 112);
    y += 140;

    var toile = document.createElement("canvas");
    toile.width = W;
    toile.height = Math.ceil(y);
    toile.getContext("2d").drawImage(brouillon, 0, 0);
    return toile;
  }

  function copier(texte) {
    if (navigator.clipboard && navigator.clipboard.writeText) return navigator.clipboard.writeText(texte);
    return new Promise(function (resolve, reject) {
      var zone = el("textarea", { style: "position:fixed;opacity:0" });
      zone.value = texte;
      document.body.appendChild(zone);
      zone.select();
      var ok = false;
      try { ok = document.execCommand("copy"); } catch (e) { /* refusé */ }
      zone.remove();
      if (ok) resolve(); else reject(new Error("copie impossible"));
    });
  }

  function telecharger(fichier) {
    var url = URL.createObjectURL(fichier);
    var lien = el("a", { href: url, download: fichier.name });
    document.body.appendChild(lien);
    lien.click();
    lien.remove();
    setTimeout(function () { URL.revokeObjectURL(url); }, 10000);
  }

  // Comme le partage de l'accueil : la feuille de partage du téléphone
  // (WhatsApp…) reçoit l'image et le texte ; sans feuille de partage,
  // ordinateur surtout, le texte est copié et l'image téléchargée. Rien
  // n'est envoyé par le site lui-même.
  function buildPartage() {
    var zone = el("div", { class: "partage-zone" });
    var bouton = el("button", { type: "button", class: "partager" });
    bouton.innerHTML = '<svg viewBox="0 0 256 256" fill="currentColor" width="16" height="16" aria-hidden="true"><path d="M216,112v96a16,16,0,0,1-16,16H56a16,16,0,0,1-16-16V112A16,16,0,0,1,56,96H80a8,8,0,0,1,0,16H56v96H200V112H176a8,8,0,0,1,0-16h24A16,16,0,0,1,216,112ZM93.66,69.66,120,43.31V136a8,8,0,0,0,16,0V43.31l26.34,26.35a8,8,0,0,0,11.32-11.32l-40-40a8,8,0,0,0-11.32,0l-40,40A8,8,0,0,0,93.66,69.66Z"/></svg>';
    bouton.appendChild(el("span", { text: "Partager le bilan" }));
    var info = el("span", { class: "partage-ok", "aria-live": "polite" });
    bouton.addEventListener("click", function () {
      var p = dernierPartage;
      if (!p) return;
      var fichiers = p.fichier ? [p.fichier] : null;
      info.textContent = "";
      // Sans feuille de partage, ou une feuille qui refuse l'image : l'image
      // est téléchargée et le texte copié, plutôt que l'image perdue.
      function aLaMain() {
        if (fichiers) telecharger(p.fichier);
        copier(p.texte).then(function () { info.textContent = fichiers ? "Texte copié, image téléchargée" : "Texte copié, à coller"; },
                             function () { info.textContent = fichiers ? "Image téléchargée" : "Copie impossible sur ce navigateur"; });
      }
      var avecImage = fichiers && navigator.canShare && navigator.canShare({ files: fichiers });
      if (navigator.share && (!fichiers || avecImage)) {
        var donnees = { text: p.texte };
        if (avecImage) donnees.files = fichiers;
        navigator.share(donnees).catch(function (e) {
          if (e && e.name === "AbortError") return;   // partage annulé
          aLaMain();
        });
        return;
      }
      aLaMain();
    });
    zone.appendChild(bouton);
    zone.appendChild(info);
    return zone;
  }

  // ---------------------------------------------------------------
  // Assemblage
  // ---------------------------------------------------------------
  function contexte(data) {
    var clubMap = buildClubMap(data.clubs);
    var teams = buildStandings(data.rencontres, clubMap);
    var parties = partiesDePoule(data.rencontres, clubMap);
    var series = {};
    teams.forEach(function (t) {
      var cle = t.spec + "|" + t.cat;
      (series[cle] = series[cle] || { spec: t.spec, cat: t.cat, label: t.serieLabel, teams: [], jouees: [], restantes: [], autres: [] }).teams.push(t);
    });
    parties.jouees.forEach(function (p) { var s = series[p.spec + "|" + p.cat]; if (s) s.jouees.push(p); });
    parties.restantes.forEach(function (p) { var s = series[p.spec + "|" + p.cat]; if (s) s.restantes.push(p); });
    parties.autres.forEach(function (p) { var s = series[p.spec + "|" + p.cat]; if (s) s.autres.push(p); });
    var qualifies = 0;
    Object.keys(series).forEach(function (k) {
      var s = series[k];
      s.poules = teintesPoules(s.teams);
      s.rangs = {};
      Object.keys(s.poules).forEach(function (pl) {
        var classees = trierClassement(s.teams.filter(function (t) { return t.poule === pl; }));
        classees.forEach(function (t, i) { s.rangs[cleEquipe(t)] = i + 1; });
      });
      s.tableau = tableauFinal(data.rencontres, s.spec, s.cat, s.teams, s.restantes);
      // Qualifiées : les places occupées du tableau des quarts, s'il existe.
      (s.tableau.quarts || []).forEach(function (q) { q.cotes.forEach(function (c) { if (c.team) qualifies++; }); });
    });
    Object.keys(series).forEach(function (k) { series[k].chiffres = chiffres(series[k].jouees, series[k].teams.length); });
    var specs = {};
    teams.forEach(function (t) { specs[t.spec] = true; });
    var ctx = {
      teams: teams, parties: parties, series: series, qualifies: qualifies,
      suivantes: partiesSuivantes(data.rencontres, clubMap),
      plusieursSpecs: Object.keys(specs).length > 1,
      global: chiffres(parties.jouees, teams.length),
      liste: Object.keys(series).map(function (k) { return series[k]; }).sort(function (a, b) {
        var c = a.spec.localeCompare(b.spec, "fr", { numeric: true });
        return c !== 0 ? c : a.cat.localeCompare(b.cat, "fr", { numeric: true });
      })
    };
    ctx.etat = etatPoules(ctx);
    return ctx;
  }

  // D'abord le bilan global (chiffres, mon équipe, trophées toutes séries),
  // puis chaque série : ses chiffres, ses trophées, ses poules, son tableau.
  function rendre(data) {
    var results = document.getElementById("results");
    results.innerHTML = "";
    var ctx = contexte(data);
    joueursDe = data.joueurs || null;
    contactsDe = data.contacts || null;
    dernierPartage = null;
    if (!ctx.teams.length) {
      results.appendChild(el("div", { class: "empty-state", text: "Aucune partie de poule publiée pour l'instant : le bilan attendra." }));
      return;
    }
    dernierPartage = preparerPartage(ctx, data.lastSync);
    var suivies = mesEquipes();
    var global = el("section", { class: "bilan-global", "aria-label": "Bilan global" });
    global.appendChild(buildHero(ctx));
    var zoneGlobale = el("div", { class: "zone-globale" });
    var mes = buildMesEquipes(ctx);
    if (mes) zoneGlobale.appendChild(mes);
    zoneGlobale.appendChild(trophees({ label: "toutes séries", teams: ctx.teams, jouees: ctx.parties.jouees }, suivies, true));
    global.appendChild(zoneGlobale);
    results.appendChild(global);

    ctx.liste.forEach(function (serie) {
      var section = el("section", { class: "serie-bloc", "aria-label": serie.label });
      var titre = el("h2", { class: "serie-titre" });
      titre.appendChild(el("span", { class: "badge serie-" + serie.cat, text: serie.label }));
      if (ctx.plusieursSpecs) titre.appendChild(el("span", { text: SPEC_LABELS[serie.spec] || ("Spécialité " + serie.spec) }));
      titre.appendChild(el("span", { text: "Bilan de la série" }));
      titre.appendChild(el("span", {
        class: "statut" + (serie.restantes.length ? "" : " final"),
        text: serie.restantes.length ? "encore " + serie.restantes.length + " sans score" : "poules terminées"
      }));
      section.appendChild(titre);
      section.appendChild(buildTuiles(serie.chiffres, true));

      var zone = el("div", { class: "zone-bilan" });
      zone.appendChild(trophees(serie, suivies));
      Object.keys(serie.poules).sort(function (a, b) { return a.localeCompare(b, "fr", { numeric: true }); })
        .forEach(function (pl) { zone.appendChild(buildPouleCard(serie, pl, suivies, ctx)); });
      zone.appendChild(buildLegende(serie));
      zone.appendChild(buildFinalesCard(serie, suivies));
      section.appendChild(zone);
      results.appendChild(section);
    });

    results.appendChild(el("p", {
      class: "bilan-note",
      text: "Calculé d'après les scores publiés par la ligue, avec la règle du Classement : victoire 3 pts, défaite 1 pt, " +
            "rang à la moyenne de points par partie puis au goal average moyen."
    }));
  }

  // ---------------------------------------------------------------
  // Chargement : le cache d'abord, puis le réseau (spec donnees-api)
  // ---------------------------------------------------------------
  function formatTime(ts) {
    var d = new Date(ts);
    return d.toLocaleDateString("fr-FR") + " à " + d.toLocaleTimeString("fr-FR", { hour: "2-digit", minute: "2-digit" });
  }

  function formatSync(iso) {
    if (!iso) return null;
    var d = new Date(iso);
    if (Number.isNaN(d.getTime())) return null;
    return formatTime(d.getTime());
  }

  var dernierTour = 0;

  function run(forceRefresh) {
    var lastSyncText = document.getElementById("lastSyncText");
    var bannerSlot = document.getElementById("banner-slot");
    var results = document.getElementById("results");
    bannerSlot.innerHTML = "";
    lastSyncText.textContent = "chargement…";

    function afficher(data) {
      bannerSlot.innerHTML = "";
      lastSyncText.textContent = formatSync(data.lastSync) || "information indisponible";
      rendre(data);
    }

    var holder = {};
    var rendu = false;
    var signatureRendue = null;
    var sansJoueurs = false;
    var compoCache = null;
    var tour = ++dernierTour;

    fetchLiveData(viaCache(holder), viaCache({})).then(function (data) {
      if (tour !== dernierTour) return;
      afficher(data);
      rendu = true;
      signatureRendue = signature(data);
      sansJoueurs = data.joueursIncomplets;
      if (!sansJoueurs) compoCache = { joueurs: data.joueurs, contacts: data.contacts, taille: data.tailleCompo };
    }).catch(function () {
      // Cache incomplet : rien à afficher avant la réponse réseau.
    }).then(function () {
      if (tour !== dernierTour) return;
      if (rendu && !forceRefresh && !sansJoueurs && (Date.now() - holder.fetchedAt) < CACHE_TTL_MS) return;

      var skeletonTimer = rendu ? null : setTimeout(function () { renderSkeleton(results); }, 150);

      return fetchLiveData(viaReseau(forceRefresh ? 0 : CACHE_TTL_MS)).then(function (data) {
        if (skeletonTimer) clearTimeout(skeletonTimer);
        if (tour !== dernierTour) return;
        // Compositions en échec sur le réseau : celles du cache restent.
        if (data.joueursIncomplets && compoCache) {
          data.joueurs = compoCache.joueurs;
          data.contacts = compoCache.contacts;
          data.tailleCompo = compoCache.taille;
          data.joueursIncomplets = false;
        }
        if (!rendu || signature(data) !== signatureRendue) afficher(data);
        else lastSyncText.textContent = formatSync(data.lastSync) || "information indisponible";
      }).catch(function (err) {
        if (skeletonTimer) clearTimeout(skeletonTimer);
        if (tour !== dernierTour) return;
        var message = err && err.message ? err.message : String(err);
        if (rendu) {
          renderBanner(bannerSlot, "warn", "Données non rafraîchies",
            "Le dernier appel à l'API a échoué (" + message + "). " +
            "Le bilan affiché date du " + formatTime(holder.fetchedAt) + " et peut être obsolète.");
        } else {
          results.innerHTML = "";
          lastSyncText.textContent = "échec du chargement";
          renderBanner(bannerSlot, "error", "Impossible d'afficher le bilan",
            message + " — par sécurité, rien n'est affiché : un bilan incomplet induirait en erreur.");
        }
      });
    });
  }

  document.getElementById("refreshBtn").addEventListener("click", function () { run(true); });
  document.getElementById("backToTopBtn").addEventListener("click", function () {
    window.scrollTo({ top: 0, behavior: "smooth" });
  });
  run(false);
})();
</script>
